name: APE loader tools
description: "Installs zig 0.16.0, ld64.lld and llvm-strip from LLVM 18.1.8, each pinned. cmd/dist compiles the APE loaders with them, and refuses any other zig or LLD."
runs:
  using: composite
  steps:
    # Ubuntu 24.04 ships LLVM 18.1.3 and apt.llvm.org carries 18.1.8. Ubuntu 26.04 ships 18.1.8, and apt.llvm.org has no LLVM 18 for it.
    - name: Name the LLVM 18 apt source (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
        if ! curl -fsSI "https://apt.llvm.org/${codename}/dists/llvm-toolchain-${codename}-18/Release" >/dev/null; then
          echo "::notice::apt.llvm.org has no LLVM 18 for ${codename}; lld-18 and llvm-18 come from the Ubuntu archive"
          exit 0
        fi
        sudo cp "$GITHUB_ACTION_PATH/apt.llvm.org.asc" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list >/dev/null

    # A cache hit restores the packages' files and asks neither apt nor apt.llvm.org.
    - name: Install LLVM 18 (linux)
      if: runner.os == 'Linux'
      uses: wow-look-at-my/actions@cached-apt#latest
      with:
        packages: lld-18 llvm-18

    - name: Install zig (linux)
      if: runner.os == 'Linux'
      uses: wow-look-at-my/actions@cached-run#latest
      with:
        save-on: any
        paths: ${{ runner.temp }}/zig-x86_64-linux-0.16.0
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

    # The LLVM tools go in a directory of their own, so the clang and ld beside them stay off PATH.
    - name: Put ld64.lld and llvm-strip on PATH (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        tools="$RUNNER_TEMP/apeld-tools"
        mkdir -p "$tools"
        ln -s /usr/lib/llvm-18/bin/ld64.lld /usr/lib/llvm-18/bin/llvm-strip "$tools/"
        echo "$tools" >> "$GITHUB_PATH"

    - name: Install zig (darwin)
      if: runner.os == 'macOS'
      uses: wow-look-at-my/actions@cached-run#latest
      with:
        save-on: any
        paths: ${{ runner.temp }}/zig-aarch64-macos-0.16.0
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

    # The release archive links LLVM statically, so the four files it names run on their own.
    - name: Install LLVM 18 (darwin)
      if: runner.os == 'macOS'
      uses: wow-look-at-my/actions@cached-run#latest
      with:
        save-on: any
        paths: ${{ runner.temp }}/apeld-tools
        run: |
          llvm=clang+llvm-18.1.8-arm64-apple-macos11
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/$llvm.tar.xz" -o "$RUNNER_TEMP/llvm.tar.xz"
          echo "4573b7f25f46d2a9c8882993f091c52f416c83271db6f5b213c93f0bd0346a10  $RUNNER_TEMP/llvm.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/apeld-tools"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/apeld-tools" --strip-components 2 \
            "$llvm/bin/lld" "$llvm/bin/ld64.lld" "$llvm/bin/llvm-objcopy" "$llvm/bin/llvm-strip"
          rm "$RUNNER_TEMP/llvm.tar.xz"
          "$RUNNER_TEMP/apeld-tools/ld64.lld" --version
          "$RUNNER_TEMP/apeld-tools/llvm-strip" --version
          echo "$RUNNER_TEMP/apeld-tools" >> "$GITHUB_PATH"

    # A cache hit restores both directories and downloads nothing, as the other hosts do for zig.
    - name: Install zig and LLVM (NT)
      if: runner.os == 'Windows'
      uses: wow-look-at-my/actions@cached-run#latest
      with:
        save-on: any
        paths: |
          ${{ runner.temp }}/zig-x86_64-windows-0.16.0
          ${{ runner.temp }}/apeld-tools
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -o "$RUNNER_TEMP/zig.zip"
          echo "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e  $RUNNER_TEMP/zig.zip" | sha256sum -c -
          7z x "$RUNNER_TEMP/zig.zip" "-o$RUNNER_TEMP" -y >/dev/null
          # The image carries its own LLVM, at another version. The installer is a 7z archive, so the two tools come out of it without an install.
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe" -o "$RUNNER_TEMP/llvm.exe"
          echo "94af030060d88cc17e9f00ef1663ebdc1126b35e16bebdfa1e807984b70abd8f  $RUNNER_TEMP/llvm.exe" | sha256sum -c -
          7z e "$RUNNER_TEMP/llvm.exe" "-o$RUNNER_TEMP/apeld-tools" bin/ld64.lld.exe bin/llvm-strip.exe -y >/dev/null
          # A test that reads PATH keys its cached result on the string, so these keep the backslashes every other entry has.
          echo "$RUNNER_TEMP\\apeld-tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP\\zig-x86_64-windows-0.16.0" >> "$GITHUB_PATH"
