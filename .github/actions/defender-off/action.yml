name: Defender off
description: Stops Defender scanning what a build writes on an NT runner, and asserts that it stopped.

# A CI machine needs no more protection than the ubuntu and macos runners get, and the scanner reads every file the build writes.
runs:
  using: composite
  steps:
    - name: Stop Defender scanning this build
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # Exclusions first: they survive even where the switches below do not.
        foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, $env:TMP)) {
          if ($path) {
            try { Add-MpPreference -ExclusionPath $path -ErrorAction Stop }
            catch { Write-Host "exclusion $path not taken: $($_.Exception.Message)" }
          }
        }
        foreach ($name in @('go.exe', 'gofmt.exe', 'compile.exe', 'link.exe', 'asm.exe', 'cgo.exe')) {
          try { Add-MpPreference -ExclusionProcess $name -ErrorAction Stop }
          catch { Write-Host "process exclusion $name not taken: $($_.Exception.Message)" }
        }

        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop

        # Splatted: "-$switch $true" reads the name as a positional value and takes nothing.
        foreach ($switch in @('DisableBehaviorMonitoring', 'DisableIOAVProtection',
                              'DisableScriptScanning', 'DisableArchiveScanning',
                              'DisableScanningNetworkFiles')) {
          $one = @{$switch = $true}
          try { Set-MpPreference @one -ErrorAction Stop }
          catch { Write-Host "$switch not taken: $($_.Exception.Message)" }
        }

        # A run that reports success while the scanner is still on is the one outcome this step must not produce.
        $pref = Get-MpPreference
        Write-Host "DisableRealtimeMonitoring: $($pref.DisableRealtimeMonitoring)"
        Write-Host "DisableBehaviorMonitoring: $($pref.DisableBehaviorMonitoring)"
        Write-Host "ExclusionPath: $($pref.ExclusionPath -join ', ')"
        if (-not $pref.DisableRealtimeMonitoring) {
          Write-Host "::error::Defender still scans this build. Real-time monitoring did not turn off, so the NT legs pay for every file the build writes."
          exit 1
        }
