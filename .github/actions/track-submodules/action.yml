name: Track submodules
description: Check out every submodule at its gitlink, then move every org submodule onto its branch head, because a checkout restores the gitlink a commit froze.
runs:
  using: composite
  steps:
    # The checkout before this step takes no submodules. git submodule update fetches each commit in turn, and this script fetches them all at once.
    - shell: bash
      run: bash ./src/submodulefetch.bash
    # dist runs this same script too. A job that runs make.bash or make.bat after this step sets GOSUBMODULEBRANCH=off, so the script runs once.
    - shell: bash
      run: bash ./src/submodulebranch.bash "${{ github.ref_name }}"
