name: Drain the build cache uploads
description: "A go command hands its last uploads to a detached process, and the runner ends that process with the job. This waits for every upload of the job to reach the store."
runs:
  using: composite
  steps:
    - name: Wait for the build cache uploads
      shell: bash
      run: |
        if [ ! -e bin/go ] && [ ! -e bin/go.exe ]; then
          echo "no toolchain in this job, so no go command uploaded"
          exit 0
        fi
        GO_CACHE_UPLOAD_SPOOL=all ./bin/go
