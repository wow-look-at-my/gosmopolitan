name: Suite leg
description: The distribution's own all-tests entry point for one host, over a toolchain another job built.
runs:
  using: composite
  steps:

    # dist test links one APE per test package. The image leaves too little room on C: for that.
    - name: Make room for the suite (NT)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $before = (Get-PSDrive C).Free
        $junk = @(
          'C:\Android',
          'C:\Program Files (x86)\Android',
          'C:\Program Files\Microsoft SDKs\Android',
          'C:\Program Files\Google\Chrome',
          'C:\Program Files\Mozilla Firefox',
          'C:\Program Files\MongoDB',
          'C:\Program Files\PostgreSQL',
          'C:\Program Files\Unity',
          'C:\Miniconda',
          'C:\Julia',
          'C:\hostedtoolcache\windows\CodeQL',
          'C:\hostedtoolcache\windows\Ruby',
          'C:\hostedtoolcache\windows\PyPy',
          'C:\hostedtoolcache\windows\Python',
          'C:\hostedtoolcache\windows\node'
        )
        foreach ($p in $junk) {
          if (Test-Path $p) { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $p }
        }
        $after = (Get-PSDrive C).Free
        $gb = 1GB
        Write-Host ("C: free {0:N1} GB, was {1:N1} GB" -f ($after/$gb), ($before/$gb))

    - name: Take the toolchain its build leg built
      uses: wow-look-at-my/actions@cache-download#latest
      with:
        name: toolchain-${{ runner.os }}
        path: .

    - name: The restored go answers
      shell: bash
      run: ./bin/go version

    # The suite says what a bare "exit status 2" from run.bat means.
    - name: A cosmo binary built here runs here (dats)
      if: runner.os != 'Windows'
      uses: wow-look-at-my/dats@master
      with:
        tests: dats/host

    # The dats action runs a suite inside WSL on NT, which tests Linux. The host suites run on NT itself, which has no sandbox backend.
    - name: Download dats
      if: runner.os == 'Windows'
      id: dats
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: dats

    - name: A cosmo binary built here runs here (dats, on NT)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        DATS_BIN: ${{ steps.dats.outputs.path }}
      run: |
        Copy-Item $env:DATS_BIN "$env:RUNNER_TEMP\dats.exe"
        & "$env:RUNNER_TEMP\dats.exe" -v --no-sandbox test dats/host
        exit $LASTEXITCODE

    - name: The whole test suite (run.bash)
      # the distribution's own all-tests entry point, on every host it builds on. tee feeds the timing step; `shell: bash` is -o pipefail, so a red suite still fails. see docs/CI.md.
      if: runner.os != 'Windows'
      shell: bash
      run: cd src && ./run.bash 2>&1 | tee "$RUNNER_TEMP/suite.log"

    - name: The whole test suite (run.bat)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cd src
        .\run.bat
        exit $LASTEXITCODE

    - name: What the suite spent its time on
      # runs on a red suite too: the slow packages are most worth seeing when it failed. A missing log is a no-op, never a second failure.
      if: always() && runner.os != 'Windows'
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          const required = (name: string): string => {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is not set; the runner provides it to every step`);
            return value;
          };
          const summaryPath = required('GITHUB_STEP_SUMMARY');
          const logPath = `${required('RUNNER_TEMP')}/suite.log`;
          if (!fs.existsSync(logPath)) {
            core.info('no suite.log; nothing to report');
            return;
          }
          const rows = [];
          const steps = [];
          for (const line of fs.readFileSync(logPath, 'utf-8').split('\n')) {
            // dist test prints one of these per package it ran, timing the run alone.
            const hit = /^ok\s+(\S+)\s+([0-9.]+)s/.exec(line);
            if (hit) rows.push({ pkg: hit[1], secs: Number(hit[2]) });
            // dist prints one of these per step, timing the compile with the run.
            const step = /^dist (test|build) ([0-9.]+)s (.+)$/.exec(line);
            if (step) steps.push({ kind: step[1], secs: Number(step[2]), name: step[3] });
          }
          if (rows.length === 0 && steps.length === 0) {
            core.info('no timings found in suite.log');
            return;
          }
          rows.sort((left, right) => right.secs - left.secs);
          steps.sort((left, right) => right.secs - left.secs);
          const add = (list) => list.reduce((sum, row) => sum + row.secs, 0);
          const total = add(rows);
          const top = rows.slice(0, 30);
          const share = add(top);
          const lines = [`### Suite timings (${required('RUNNER_OS')})`, ''];
          if (rows.length > 0) {
            lines.push(
              `${rows.length} packages, ${total.toFixed(1)}s of package time.`,
              `The 30 slowest are ${share.toFixed(1)}s of that (${((share / total) * 100).toFixed(0)}%).`,
              '',
              '| seconds | package |',
              '| ---: | --- |',
              ...top.map((row) => `| ${row.secs.toFixed(2)} | \`${row.pkg}\` |`),
              '',
            );
          }
          if (steps.length > 0) {
            const built = add(steps.filter((step) => step.kind === 'build'));
            const ran = add(steps.filter((step) => step.kind === 'test'));
            const topSteps = steps.slice(0, 30);
            lines.push(
              `### Where the leg's time went`,
              '',
              `${steps.length} steps, ${(built + ran).toFixed(1)}s of step time.`,
              `${built.toFixed(1)}s built a test binary and ran nothing.`,
              `The remaining ${ran.toFixed(1)}s held ${total.toFixed(1)}s of package runs, so ${Math.max(ran - total, 0).toFixed(1)}s compiled and started them.`,
              '',
              '| seconds | kind | step |',
              '| ---: | --- | --- |',
              ...topSteps.map((step) => `| ${step.secs.toFixed(2)} | ${step.kind} | \`${step.name}\` |`),
            );
          }
          fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
          core.info(`recorded ${rows.length} package timings and ${steps.length} steps`);

