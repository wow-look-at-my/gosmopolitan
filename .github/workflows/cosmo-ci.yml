# CI workflow for GOOS=cosmo cross-platform testing -- see CLAUDE.md "CI"

name: Cosmopolitan Cross-Platform CI

on:
  push:
    # matches every branch and no tag, so a tag push does not re-enter this workflow.
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The shared cache's look-ahead pool fetches the objects stored beside each hit ahead of the build (go-s3-server docs/look-ahead.md).
env:
  GO_TOOLCHAIN_CACHE_LOOKAHEAD: "16"

jobs:
  # Build Go toolchain and APE test binary on each build platform -- see docs/CI.md "build job".
  build:
    # make.bash plus the APE builds; the suite is its own job.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        build-os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.build-os }}

    steps:
      # src/cmd/vendor holds three submodules; without them cmd/go cannot build.
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The org's gates, and the scanner it turns off. It carries yaml-comment-block, so this file names that one no more.
      - uses: wow-look-at-my/actions@common-checks#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      # Linux confines a dependency's generate directive with it; macOS uses seatbelt and needs nothing.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        # A cold build, with the shared cache unreachable, takes over 8 minutes on macOS.
        timeout-minutes: 20
        uses: wow-look-at-my/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -v
          windows: cd src && .\make.bat -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - uses: ./.github/actions/build-leg

  # The ubuntu build leg, its own job so cosmo-checks, wasm and wasm-suite take its toolchain the moment it exists: needs waits on a whole matrix.
  build-linux:
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@common-checks#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      # cmd/go confines a dependency's generate directive with it, and fails the build when it is absent.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        timeout-minutes: 20
        shell: bash
        run: cd src && ./make.bash -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - uses: ./.github/actions/build-leg

  # The whole suite per host, in parts that run side by side; nothing downstream of a build waits on it.
  suite:
    timeout-minutes: 150
    needs: [build, build-linux]
    permissions:
      id-token: write
      contents: read
    strategy:
      # Every leg runs to the end and reports. One host's red says nothing about the other five, and a suite exists to name everything that is broken at once.
      fail-fast: false
      matrix:
        suite-os: [ubuntu-latest, macos-latest, windows-latest]
        # dist test -shard: part 0 is the package tests, built once as one go test; part 1 is every other test. dats/checks/suite-shards.dats holds both lists whole.
        shard: [0, 1]
        shards: [2]

    runs-on: ${{ matrix.suite-os }}
    env:
      # cmd/go's script suite runs in full now that the linked tools resolve, and the darwin runner needs the longer package deadline.
      GO_TEST_TIMEOUT_SCALE: 2

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@common-checks#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      # run.bash rebuilds the cmd packages from this tree, so the suite tests the client source the build leg linked in.
      - uses: ./.github/actions/track-submodules
      # run.bash reaches the same sandboxed generate directives the build leg does.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      - uses: ./.github/actions/suite-leg
        with:
          shard: ${{ matrix.shard }}/${{ matrix.shards }}

  # Checks whose answer does not depend on the host. Each runs once, here, on the linux toolchain.
  cosmo-checks:
    timeout-minutes: 60
    needs: build-linux
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        shell: bash
        run: |
          set -euo pipefail
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-amd64"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # apeld-reproducible.dats rebuilds the committed APE loaders with these; the tarball is pinned by digest so they cannot drift with a zig release.
      - name: Install the toolchain that builds the APE loaders
        shell: bash
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld-18 llvm-18
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          echo "LLD=/usr/lib/llvm-18/bin/ld64.lld" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip-18" >> "$GITHUB_ENV"

      # Every host-independent suite. Which tests each covers is the suite's decision, not this file's.
      - name: The dats suites
        timeout-minutes: 45
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/checks

  # Test all APE binaries on each platform using Go tests -- see docs/CI.md "test job".
  test:
    timeout-minutes: ${{ matrix.job-timeout }}
    needs: [build, build-linux]
    strategy:
      fail-fast: true
      matrix:
        test-os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - test-os: ubuntu-latest
            job-timeout: 25
          - test-os: macos-latest
            job-timeout: 25
          - test-os: windows-latest
            job-timeout: 40

    runs-on: ${{ matrix.test-os }}

    steps:
      - name: Checkout code (for Go tests)
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: wow-look-at-my/actions@common-checks#latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download the ubuntu-origin APE binaries
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-Linux
          path: binaries/ape-binary-Linux

      - name: Download the macOS-origin APE binaries
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-macOS
          path: binaries/ape-binary-macOS

      - name: Download the windows-origin APE binaries
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-Windows
          path: binaries/ape-binary-Windows

      # Prefetched separately so a stalled module download can't masquerade as a hung test step.
      - name: Download apetest modules
        timeout-minutes: 3
        shell: bash
        run: |
          cd testdata/ape/apetest
          sh ./with-deadline.sh 150 go mod download

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) a=amd64 ;; aarch64) a=arm64 ;; *) echo "no loader for $(uname -m)" >&2; exit 1 ;; esac
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-$a"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # apetest per origin then the subsets, and the read-only boot. readonly-boot is unix-only: NTFS ignores the mode bit it relies on, and nt.dats carries that claim for NT.
      - name: The APE binaries run on this host (dats)
        if: matrix.test-os != 'windows-latest'
        timeout-minutes: 45
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/test/apetest.dats dats/test/readonly-boot.dats

      # The container shape is built from mount namespaces, so it is linux only.
      - name: An APE runs in a read-only container (dats)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/test/readonly-boot-container.dats

      # The dats action runs a suite inside WSL on NT, which tests Linux. These suites are about NT itself, which has no sandbox backend.
      - name: Download dats
        if: matrix.test-os == 'windows-latest'
        id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
        with:
          project: dats

      - name: The APE binaries run on this host, and the NT host suite (dats, on NT)
        if: matrix.test-os == 'windows-latest'
        timeout-minutes: 45
        shell: pwsh
        env:
          DATS_BIN: ${{ steps.dats.outputs.path }}
        run: |
          Copy-Item $env:DATS_BIN "$env:RUNNER_TEMP\dats.exe"
          & "$env:RUNNER_TEMP\dats.exe" -v --no-sandbox test dats/test/apetest.dats dats/test/nt.dats
          exit $LASTEXITCODE

  # Regression-gate the WebAssembly ports (GOOS=js and GOOS=wasip1) -- see docs/WASM.md and docs/CI.md "wasm job".
  wasm:
    # Off while the wasip1 suite recompiles its modules and starves the queue; flip the condition back to re-enable. waiver-expires: 2026-09-21
    if: ${{ false }}
    timeout-minutes: 45
    needs: build-linux
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # wasm_exec_node.js (the js/wasm exec wrapper in lib/wasm) requires node >= 18.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wazero (wasip1 runtime)
        # Runs before the fork toolchain is built so `go` is unambiguously the setup-go bootstrap -- see docs/CI.md "wasm job".
        timeout-minutes: 5
        shell: bash
        run: GOOS=linux GOARCH=amd64 GOBIN="$RUNNER_TEMP/wasibin" go install github.com/tetratelabs/wazero/cmd/wazero@v1.12.0 && sudo install -m 0755 "$RUNNER_TEMP/wasibin/wazero" /usr/local/bin/wazero

      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # Every wasm suite: std for both ports, the object writer, the node and wasip1sock transports, wasmexport and GOWASM=threads.
      - name: The wasm dats suites
        timeout-minutes: 40
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/wasm

  # The whole test suite for each wasm port, the gate the other ports get -- see docs/CI.md "wasm-suite job".
  wasm-suite:
    # Off while the wasip1 suite recompiles its modules and starves the queue; flip the condition back to re-enable. waiver-expires: 2026-09-21
    if: ${{ false }}
    timeout-minutes: 60
    needs: build-linux
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        port: [js, wasip1]
        # The same dist test parts as the suite job.
        shard: [0, 1]
        shards: [2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Node.js
        if: matrix.port == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wasmtime (wasip1 runtime)
        # The exec wrapper's default engine, at the release upstream's wasip1 builder pins: v15 onward answers a FIFO read with ESPIPE (wasitest TestNonblock), and wazero sits 10 pages over test/wasmmemsize's ceiling.
        if: matrix.port == 'wasip1'
        timeout-minutes: 5
        shell: bash
        run: curl -sSfL https://wasmtime.dev/install.sh | bash -s -- --version v14.0.4

      # wasmtime compiles each test binary's module before running it, and that compile is most of a cheap package: sort.test costs 2.53s cold against 1.05s warm.
      - name: Keep the compiled wasm modules between runs
        if: matrix.port == 'wasip1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-modules-${{ matrix.port }}-${{ matrix.shard }}of${{ matrix.shards }}-${{ github.sha }}
          restore-keys: wasmtime-modules-${{ matrix.port }}-${{ matrix.shard }}of${{ matrix.shards }}-


      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      - name: The whole test suite (dist test)
        # Actions withholds this job's log for the hour it runs, so the command streams live instead.
        uses: wow-look-at-my/log-streamer/.github/actions/stream@master
        with:
          stream-key: ${{ secrets.LOG_STREAMER_STREAM_KEY }}
          name: ${{ matrix.port }}-${{ matrix.shard }}of${{ matrix.shards }}
          run: |
            set -o pipefail
            export PATH="$PWD/bin:$PWD/lib/wasm:$HOME/.wasmtime/bin:$PATH"
            sh ./.github/resource-log.sh &
            probe=$!
            # the stream client reads until every holder of its pipe exits, so the probe goes when this script does.
            trap 'kill "$probe"' EXIT
            GOOS=${{ matrix.port }} GOARCH=wasm stdbuf -oL -eL go tool dist test -shard=${{ matrix.shard }}/${{ matrix.shards }} 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: What ${{ matrix.port }} part ${{ matrix.shard }} of ${{ matrix.shards }} spent its time on
        # the per-package times are how the js and wasip1 ports get compared, and how a leg that overruns its budget names what overran.
        if: always()
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const required = (name: string): string => {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is not set; the runner or this step's env provides it`);
              return value;
            };
            const summaryPath = required('GITHUB_STEP_SUMMARY');
            const logPath = `${required('RUNNER_TEMP')}/suite.log`;
            const port = required('WASM_PORT');
            if (!fs.existsSync(logPath)) {
              core.info('no suite.log; nothing to report');
              return;
            }
            const rows = [];
            for (const line of fs.readFileSync(logPath, 'utf-8').split('\n')) {
              // dist test prints one of these per package it ran.
              const hit = /^ok\s+(\S+)\s+([0-9.]+)s/.exec(line);
              if (hit) rows.push({ pkg: hit[1], secs: Number(hit[2]) });
            }
            if (rows.length === 0) {
              core.info('no per-package timings found in suite.log');
              return;
            }
            rows.sort((left, right) => right.secs - left.secs);
            const total = rows.reduce((sum, row) => sum + row.secs, 0);
            const top = rows.slice(0, 40);
            const lines = [
              `### ${port} suite timings`,
              '',
              `${rows.length} packages, ${total.toFixed(1)}s of package time.`,
              '',
              '| seconds | package |',
              '| ---: | --- |',
              ...top.map((row) => `| ${row.secs.toFixed(2)} | \`${row.pkg}\` |`),
            ];
            fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
            core.info(`${port}: recorded ${rows.length} package timings, ${total.toFixed(1)}s total`);
        env:
          WASM_PORT: ${{ matrix.port }} part ${{ matrix.shard }}/${{ matrix.shards }}


  # The hand-offs live in the actions cache. Delete them once every consumer has run.
  cache-cleanup:
    needs: [test, suite, cosmo-checks, wasm, wasm-suite]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: wow-look-at-my/actions@cache-cleanup#latest

  # Publishes an installable toolchain distribution to buildhost on every green push -- see docs/CI.md "publish jobs".
  publish-create:
    timeout-minutes: 10
    # Switching the wasm legs back on goes with putting them back here: a needed job reporting `skipped` skips this one.
    needs: [build, build-linux, suite, cosmo-checks, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token buildhost authenticates
      contents: read
      artifact-metadata: write
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create buildhost release
        # No version input: buildhost auto-increments it. See docs/CI.md "publish jobs".
        id: release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-create-release@master
        with:
          project: gosmopolitan

  publish-upload:
    # macOS make.bash runs ~4m30s at its slowest observed and windows make.bat ~3m15s; distpack adds seconds.
    timeout-minutes: 25
    needs: publish-create
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@common-checks#latest
      # make.bash fails a CI run with no shared cache configured; this step exports GO_BUILDCACHE_CONFIG.
      - uses: wow-look-at-my/actions@secret-server#latest
      # The published toolchain is built here, so it carries the client's branch head rather than the gitlink's commit.
      - uses: ./.github/actions/track-submodules

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Stamp unique per-release version
        # see docs/CI.md "publish jobs" -- avoids collisions in the shared build cache namespace.
        shell: bash
        run: |
          printf '%s.r%s\n' "$(head -n1 VERSION)" '${{ github.run_number }}' > VERSION
          echo "VERSION stamped: $(cat VERSION)"

      - name: Build distribution archive
        # Writes the official-style go<VERSION>.<goos>-<goarch>.tar.gz to pkg/distpack, on every platform -- see docs/CI.md "publish jobs".
        timeout-minutes: 15
        uses: wow-look-at-my/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -distpack
          windows: cd src && .\make.bat -distpack
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      # Publish flow: buildhost's own composite actions -- see docs/CI.md "publish jobs".
      - name: Locate distribution tarball
        id: tarball
        uses: wow-look-at-my/actions@typescript#latest
        env:
          DIST_SUFFIX: ${{ matrix.goos }}-${{ matrix.goarch }}
        with:
          script: |
            // buildhost-upload-artifact takes an exact file path -- resolve the versioned distpack tarball name (go<VERSION>.<goos>-<goarch>.tar.gz)
            const distDir = 'pkg/distpack';
            const suffix = `.${process.env.DIST_SUFFIX}.tar.gz`;
            const names = fs.readdirSync(distDir).filter((f) => f.startsWith('go') && f.endsWith(suffix));
            if (names.length !== 1) {
              throw new Error(`want exactly one go*${suffix} in ${distDir}, ` +
                `found [${names.join(', ')}] among [${fs.readdirSync(distDir).join(', ')}]`);
            }
            // Forward slashes: a windows path loses its separators crossing the step output, and node opens either spelling.
            const tarball = path.posix.join(distDir, names[0]);
            core.info(`${tarball}: ${fs.statSync(tarball).size} bytes`);
            core.setOutput('path', tarball);
            core.setOutput('name', names[0]);

      - name: Upload toolchain tarball
        timeout-minutes: 10
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-upload-artifact@master
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          kind: archive
          path: ${{ steps.tarball.outputs.path }}
          filename: ${{ steps.tarball.outputs.name }}

      - name: Log uploaded artifact
        shell: bash
        run: |
          echo "::notice::uploaded ${{ steps.tarball.outputs.name }} to gosmopolitan v${{ needs.publish-create.outputs.version }} (${{ matrix.goos }}/${{ matrix.goarch }})"

  publish-finish:
    timeout-minutes: 10
    needs: [publish-create, publish-upload]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Publish buildhost release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-release@master
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}

      - name: Log published release
        shell: bash
        run: |
          v='${{ needs.publish-create.outputs.version }}'
          b='${{ github.ref_name }}'
          echo "::notice::published gosmopolitan v$v for linux/amd64 and darwin/arm64"
          echo "::notice::linux:  https://dl.pazer.build/gosmopolitan?branch=$b&os=linux&arch=amd64"
          echo "::notice::darwin: https://dl.pazer.build/gosmopolitan?branch=$b&os=darwin&arch=arm64"
