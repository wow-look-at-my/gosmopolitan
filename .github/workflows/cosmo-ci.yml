# CI workflow for GOOS=cosmo cross-platform testing
# Tests that APE binaries built on any platform (Linux/macOS/Windows) run
# on all platforms. Each of the 2 unix test runners tests all 3 origin
# binaries with the full apetest suite. Windows runs the same fat APEs
# natively through their PE header via the cosmo runtime's NT
# personality (cosmo NT bring-up wave 1): a dedicated windows job
# byte-checks real fizzbuzz output and runs apetest (runtimeprobe
# execution stays skipped there until a later wave grows the NT surface
# it needs).

name: Cosmopolitan Cross-Platform CI

on:
  push:
  workflow_dispatch:

jobs:
  # Build Go toolchain and APE test binary on each build platform
  #
  # Job and step timeout-minutes are deliberate everywhere: a hung cosmo
  # binary (or a wedged runner) must never burn GitHub's 6-hour default.
  # Limits are sized ~2x (or a round number above) the slowest duration
  # observed across recent green runs; see the values at each step.
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build-os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.build-os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        # Observed max 3m14s (windows make.bat); unix ~2m30s.
        timeout-minutes: 8
        uses: wow-look-at-my-code/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -v
          windows: cd src && .\make.bat -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - name: Build APE binary
        # Observed max 38s (windows; two fat builds = four link passes).
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          # No GOARCH pin: GOOS=cosmo go build emits a fat (amd64+arm64)
          # APE regardless of the host architecture.
          GOOS=cosmo go build -o fizzbuzz.com testdata/fizzbuzz/fizzbuzz.go
          # The probe is a multi-file package, so build its module directory.
          (cd testdata/runtimeprobe && GOOS=cosmo go build -o "$GITHUB_WORKSPACE/runtimeprobe.com" .)
          echo "=== APE Header ==="
          head -c 200 fizzbuzz.com
          echo ""
          echo "=== File info ==="
          file fizzbuzz.com runtimeprobe.com 2>/dev/null || true
          ls -la fizzbuzz.com runtimeprobe.com

      - name: Upload APE binary
        uses: actions/upload-artifact@v4
        with:
          name: ape-binary-${{ matrix.build-os }}
          path: |
            fizzbuzz.com
            runtimeprobe.com
          retention-days: 1

  # Test all APE binaries on each unix platform using Go tests
  # Each runner tests all 3 origin binaries sequentially (its native one
  # plus the two cross-compiled elsewhere). Windows execution is covered
  # by the dedicated test-windows job below (native NT boot: direct
  # fizzbuzz output check plus apetest).
  #
  # Job-level cap: 3 test steps at 5 minutes each plus setup; observed
  # green total is under 2 minutes. Individual steps carry their own
  # timeout-minutes (and an in-step killer, see with-deadline.sh).
  test:
    timeout-minutes: 25
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test-os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.test-os }}

    steps:
      - name: Checkout code (for Go tests)
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download all APE binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Make binaries executable
        uses: wow-look-at-my-code/actions/multicmd@master
        with:
          unix: chmod +x binaries/ape-binary-*/fizzbuzz.com binaries/ape-binary-*/runtimeprobe.com

      # Prefetch test-module dependencies separately so a stalled module
      # download cannot masquerade as a hung test step.
      - name: Download apetest modules
        timeout-minutes: 3
        shell: bash
        run: |
          cd testdata/ape/apetest
          sh ./with-deadline.sh 150 go mod download

      # Each test step runs go test under an in-step process-group killer
      # (see with-deadline.sh): runner-side step timeouts have been
      # observed not to fire when a step wedges on the macOS runners
      # (jobs sat 30+ minutes past timeout-minutes and uploaded no logs;
      # one wedged process even survived a process-group SIGKILL, i.e. it
      # was stuck in an uninterruptible kernel state). The killer abandons
      # such a corpse so the step still ends, and go test's output goes
      # through a FILE (cat'ed afterwards) so no abandoned descendant can
      # keep the runner's log pipe open.
      - name: Test binary built on Ubuntu
        id: test-ubuntu
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/runtimeprobe.com" sh ./with-deadline.sh 240 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      # Upload the captured log immediately: job-level logs only reach
      # the API when the whole job ends, which a wedged later step (or a
      # runner poisoned by an unkillable corpse) can prevent forever.
      - name: Upload ubuntu-origin test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.test-os }}-ubuntu-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

      - name: Test binary built on macOS
        id: test-macos
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-macos-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-macos-latest/runtimeprobe.com" sh ./with-deadline.sh 240 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      # Upload the captured log immediately: job-level logs only reach
      # the API when the whole job ends, which a wedged later step (or a
      # runner poisoned by an unkillable corpse) can prevent forever.
      - name: Upload macos-origin test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.test-os }}-macos-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

      - name: Test binary built on Windows
        id: test-windows
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/runtimeprobe.com" sh ./with-deadline.sh 240 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      # Upload the captured log immediately: job-level logs only reach
      # the API when the whole job ends, which a wedged later step (or a
      # runner poisoned by an unkillable corpse) can prevent forever.
      - name: Upload windows-origin test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.test-os }}-windows-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

  # Windows execution acceptance (cosmo NT bring-up wave 1, north
  # star): a normal fat APE - cosmo amd64 + arm64, no embedded second
  # build - boots natively on Windows through its PE header and the
  # cosmo runtime's NT personality. Two rungs, against both the
  # ubuntu-origin and windows-origin artifacts (all origins build
  # identical headers):
  #
  #  1. Direct invocation: the same contract apetest asserts
  #     (`fizzbuzz.com <a> <b>` prints fizzbuzz(a+b) + "\n" on stdout,
  #     exit 0), with a byte-for-byte stdout compare.
  #  2. The apetest suite, natively. FIZZBUZZ_BIN only:
  #     RUNTIMEPROBE_BIN stays deliberately unset, so the probe
  #     execution test self-skips - the probe needs far more NT
  #     surface (sockets, signals, os/exec) than wave 1 provides.
  test-windows:
    timeout-minutes: 30
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout code (for apetest)
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download ubuntu-origin APE binary
        uses: actions/download-artifact@v4
        with:
          name: ape-binary-ubuntu-latest
          path: binaries/ape-binary-ubuntu-latest

      - name: Download windows-origin APE binary
        uses: actions/download-artifact@v4
        with:
          name: ape-binary-windows-latest
          path: binaries/ape-binary-windows-latest

      - name: Run fizzbuzz on Windows (NT boot acceptance)
        timeout-minutes: 5
        shell: pwsh
        run: |
          # A binary the loader refuses to start throws instead of
          # setting an exit code; make that fail the step immediately.
          #
          # The binaries run via Start-Process rather than pwsh native
          # invocation (& $copy): on be6c8c72 both binaries printed the
          # correct exit code, yet the pwsh host then sat ~18s past the
          # final success line and died with exit code 1 and zero
          # diagnostics - a native-command/console teardown artifact,
          # not an assertion failure. Start-Process + $p.ExitCode
          # isolates the check from that teardown path, and the script
          # ends in an explicit exit so the host quits before whatever
          # teardown threw. Per-binary lines before and after each run
          # localize any future hang.
          #
          # Cases restate apetest/fizzbuzz_test.go's invocation
          # contract: `fizzbuzz.com <num1> <num2>` prints
          # fizzbuzz(num1+num2) and a trailing \n (fmt.Println), exit
          # 0. TestFizzbuzz_15 (10+5) wants "fizzbuzz"; TestNumber_13
          # (7+6) wants "13" - the second case proves argv values
          # actually flow through GetCommandLineW parsing rather than
          # printing a constant.
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $cases = @(
            @{ Args = @('10', '5'); Want = "fizzbuzz`n" },
            @{ Args = @('7', '6');  Want = "13`n" }
          )
          foreach ($origin in @('ubuntu-latest', 'windows-latest')) {
            # Run a throwaway copy so the downloaded artifact stays
            # pristine (APE binaries self-assimilate on unix hosts;
            # keep the same hygiene here).
            $src = "binaries/ape-binary-$origin/fizzbuzz.com"
            $copy = Join-Path $env:RUNNER_TEMP "fizzbuzz-$origin.com"
            Copy-Item $src $copy
            foreach ($case in $cases) {
              $out = Join-Path $env:RUNNER_TEMP "stdout-$origin-$($case.Args -join '-').txt"
              Write-Host "${origin}: launching $copy $($case.Args -join ' ')"
              $p = Start-Process -FilePath $copy -ArgumentList $case.Args -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
              $got = [System.IO.File]::ReadAllText($out)
              Write-Host "${origin}: exit code $($p.ExitCode) (want 0), stdout $($got | ConvertTo-Json)"
              if ($p.ExitCode -ne 0) { $failed = $true }
              if ($got -cne $case.Want) {
                Write-Host "${origin}: stdout mismatch: got $($got | ConvertTo-Json), want $($case.Want | ConvertTo-Json)"
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 } else { exit 0 }

      # Prefetch test-module dependencies separately so a stalled module
      # download cannot masquerade as a hung test step (same split as
      # the unix legs). with-deadline.sh self-detects git-bash and
      # degrades to a plain exec: the in-test 3-minute deadlines plus
      # the step timeout-minutes are the watchdogs here.
      - name: Download apetest modules
        timeout-minutes: 3
        shell: bash
        run: |
          cd testdata/ape/apetest
          sh ./with-deadline.sh 150 go mod download

      - name: apetest vs ubuntu-origin binary
        id: apetest-ubuntu
        timeout-minutes: 10
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/fizzbuzz.com" sh ./with-deadline.sh 540 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      - name: Upload ubuntu-origin windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows-latest-ubuntu-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

      - name: apetest vs windows-origin binary
        id: apetest-windows
        timeout-minutes: 10
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/fizzbuzz.com" sh ./with-deadline.sh 540 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      - name: Upload windows-origin windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows-latest-windows-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

  # Regression-gate the WebAssembly ports (GOOS=js and GOOS=wasip1) that
  # this fork patches; see WASM_SHORTCOMINGS.md for the catalog of fixes.
  # Wasm output is host-independent, so a single ubuntu leg is enough.
  # Builds std for both ports, runs the stdlib packages the wasm fixes
  # touch under node 22 (js) and wazero (wasip1), and runs the wasmexport
  # compiler regression tests via the testdir harness for both targets.
  #
  # Job cap is a backstop only: a hung step trips its own timeout-minutes
  # first, and later steps are skipped on failure. Observed green total is
  # well under 15 minutes.
  wasm:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # wasm_exec_node.js (the js/wasm exec wrapper in lib/wasm) requires
      # node >= 18.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wazero (wasip1 runtime)
        # Observed 23s locally, including the go1.25 toolchain auto-download
        # the wazero module demands. Runs before the fork toolchain is built
        # so `go` is unambiguously the bootstrap from setup-go: the fork's
        # bin/go defaults GOOS=cosmo, so a bare `go install` with it would
        # cross-compile. GOOS/GOARCH are pinned anyway, belt and braces.
        timeout-minutes: 5
        shell: bash
        run: GOOS=linux GOARCH=amd64 GOBIN="$HOME/wasibin" go install github.com/tetratelabs/wazero/cmd/wazero@v1.12.0

      - name: Build Go toolchain
        # Same build as the build job's ubuntu leg; observed ~2m30s.
        timeout-minutes: 8
        shell: bash
        run: cd src && ./make.bash -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - name: Build std for js/wasm and wasip1/wasm
        # Observed 22s + 15s locally on a cold cache.
        timeout-minutes: 5
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          GOOS=js GOARCH=wasm go build std
          GOOS=wasip1 GOARCH=wasm go build std

      - name: Test js/wasm under node
        # Observed 1m18s locally. lib/wasm supplies go_js_wasm_exec.
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$PATH"
          GOOS=js GOARCH=wasm go test -short -count=1 runtime runtime/pprof sync sync/atomic time os syscall syscall/js math math/bits os/signal net/http

      - name: Test wasip1/wasm under wazero
        # Observed 57s locally. lib/wasm supplies go_wasip1_wasm_exec.
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$HOME/wasibin:$PATH"
          GOWASIRUNTIME=wazero GOOS=wasip1 GOARCH=wasm go test -short -count=1 runtime runtime/pprof sync sync/atomic time os syscall math

      - name: Compiler regression tests (testdir wasmexport, both targets)
        # Observed 9s locally. GOOS=linux pin: the harness test binary runs
        # on the host (the fork's go would otherwise target cosmo); -target
        # selects the wasm port under test.
        timeout-minutes: 5
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$HOME/wasibin:$PATH"
          GOWASIRUNTIME=wazero GOOS=linux GOARCH=amd64 go test cmd/internal/testdir -run 'Test/wasmexport' -target=js/wasm
          GOWASIRUNTIME=wazero GOOS=linux GOARCH=amd64 go test cmd/internal/testdir -run 'Test/wasmexport' -target=wasip1/wasm

  # Publish an installable toolchain distribution to buildhost (pazer.build)
  # on every push, once build+test are green. Consumers then install the fork
  # in seconds instead of running a ~3 minute make.bash:
  #
  #   curl -fL --compressed "https://dl.pazer.build/gosmopolitan?branch=master&os=linux&arch=amd64" | tar -xz
  #
  # Auth is a GitHub Actions OIDC token (audience https://pazer.build); the
  # buildhost project auto-provisions on the first authenticated push, and
  # every branch gets its own rolling latest (?branch=<name>).
  publish:
    timeout-minutes: 15
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token buildhost authenticates
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build distribution tarball
        # The build job's ubuntu build plus distpack packaging: writes the
        # official-style go<VERSION>.linux-amd64.tar.gz to pkg/distpack.
        # make.bash alone is ~2m30s; distpack adds only seconds.
        timeout-minutes: 10
        shell: bash
        run: cd src && ./make.bash -distpack
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - name: Publish toolchain tarball to buildhost
        timeout-minutes: 5
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // Publish pkg/distpack's linux-amd64 tarball to buildhost.
            //
            // REST flow (https://pazer.build/llms.txt): create release ->
            // upload artifact -> publish release. Two upload paths: a single
            // direct PUT for bodies up to server-info's
            // max_direct_upload_bytes, else a chunked upload session --
            // Cloudflare's edge in front of buildhost rejects request bodies
            // over ~100 MB, so a big tarball must go up in pieces and be
            // finalized by session id + sha256.
            const project = 'gosmopolitan';
            const api = 'https://pazer.build/api/v1';

            const distDir = 'pkg/distpack';
            const names = fs.readdirSync(distDir).filter((f) => /^go.*\.linux-amd64\.tar\.gz$/.test(f));
            if (names.length !== 1) {
              throw new Error(`want exactly one go*.linux-amd64.tar.gz in ${distDir}, ` +
                `found [${names.join(', ')}] among [${fs.readdirSync(distDir).join(', ')}]`);
            }
            const tarball = path.join(distDir, names[0]);
            const data = fs.readFileSync(tarball);
            core.info(`${tarball}: ${data.length} bytes`);

            const branch = process.env.GITHUB_REF_NAME;
            if (!branch) throw new Error('GITHUB_REF_NAME is not set');

            const token = await core.getIDToken('https://pazer.build');
            const auth: Record<string, string> = { Authorization: `Bearer ${token}` };

            // fetch with up to 3 attempts on transient failures (network
            // error, 5xx, 429); other non-2xx statuses fail immediately.
            // Errors carry the response body.
            async function call(method: string, url: string, headers: Record<string, string>, body?: Buffer | string) {
              let failure = '';
              for (let attempt = 1; attempt <= 3; attempt++) {
                if (attempt > 1) {
                  core.warning(`${method} ${url}: ${failure} -- retrying (attempt ${attempt}/3)`);
                  await new Promise((r) => setTimeout(r, 3000 * (attempt - 1)));
                }
                let res;
                try {
                  res = await fetch(url, { method, headers, body });
                } catch (e) {
                  failure = `network error: ${e}`;
                  continue;
                }
                if (res.ok) return res;
                failure = `HTTP ${res.status}: ${await res.text()}`;
                if (res.status < 500 && res.status !== 429) break;
              }
              throw new Error(`${method} ${url} failed: ${failure}`);
            }

            // The direct-PUT ceiling comes from the server, not a hardcoded guess.
            const info = (await (await call('GET', `${api}/server-info`, auth)).json()) as { max_direct_upload_bytes?: number };
            const maxDirect = info.max_direct_upload_bytes ?? 99614720;

            // Create the release. The project auto-provisions on first OIDC push.
            const createRes = await call('POST', `${api}/projects/${project}/releases`,
              { ...auth, 'Content-Type': 'application/json' },
              JSON.stringify({ git_branch: branch, git_commit: context.sha }));
            const createBody = await createRes.text();
            let version = '';
            try {
              const rel = JSON.parse(createBody) as { version?: number | string };
              if (rel.version !== undefined && rel.version !== null) version = String(rel.version);
            } catch {}
            if (!version) throw new Error(`release create response has no version: ${createBody}`);
            core.info(`release ${version} created (branch=${branch} commit=${context.sha})`);

            const artifact = `${api}/projects/${project}/releases/${version}/artifacts/linux/amd64`;
            const octet = { ...auth, 'Content-Type': 'application/octet-stream' };
            if (data.length <= maxDirect) {
              core.info(`direct upload (${data.length} <= ${maxDirect} bytes)`);
              await call('PUT', `${artifact}?kind=binary`, octet, data);
            } else {
              core.info(`chunked upload (${data.length} > ${maxDirect} bytes)`);
              const sha256 = require('crypto').createHash('sha256').update(data).digest('hex');
              const sess = (await (await call('POST', `${api}/uploads`, auth)).json()) as { id?: number | string };
              if (sess.id === undefined || sess.id === null) throw new Error(`upload session response has no id`);
              const chunk = 64 * 1024 * 1024;
              for (let off = 0; off < data.length; off += chunk) {
                const end = Math.min(off + chunk, data.length);
                await call('PATCH', `${api}/uploads/${sess.id}?offset=${off}`, octet, data.subarray(off, end));
                core.info(`uploaded bytes ${off}..${end} of ${data.length}`);
              }
              await call('PUT', `${artifact}?kind=binary&upload_session=${sess.id}&upload_sha256=${sha256}`, auth);
            }

            await call('POST', `${api}/projects/${project}/releases/${version}/publish`, auth);

            const dl = `https://dl.pazer.build/${project}?branch=${encodeURIComponent(branch)}&os=linux&arch=amd64`;
            core.notice(`published ${names[0]} (${data.length} bytes) as ${project} v${version}: ${dl}`);
