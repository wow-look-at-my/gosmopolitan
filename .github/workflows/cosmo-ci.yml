# CI workflow for GOOS=cosmo cross-platform testing -- see CLAUDE.md "CI"

name: Cosmopolitan Cross-Platform CI

on:
  push:
    # matches every branch and no tag, so a tag push does not re-enter this workflow.
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The shared cache's look-ahead pool fetches the objects stored beside each hit ahead of the build (go-s3-server docs/look-ahead.md).
env:
  GO_TOOLCHAIN_CACHE_LOOKAHEAD: "16"

jobs:
  # Every check that reads the tree and nothing else. It waits on no build, so a violation is named within the minute.
  source-checks:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@common-checks#latest

      - name: The source suites
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/source

  # Build Go toolchain and APE test binary on each build platform -- see docs/CI.md "build job".
  build:
    # make.bash plus the APE builds; the suite is its own job.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        build-os: [macos-latest, windows-latest]
        # NT is the longest leg by far, so it is excluded rather than built. Drop this exclude to build it again. waiver-expires: 2026-09-28
        exclude:
          - build-os: windows-latest

    runs-on: ${{ matrix.build-os }}

    steps:
      # src/cmd/vendor holds three submodules; without them cmd/go cannot build.
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The org's gates, and the scanner it turns off. It carries yaml-comment-block, so this file names that one no more.
      - uses: wow-look-at-my/actions@common-checks#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      # Linux confines a dependency's generate directive with it; macOS uses seatbelt and needs nothing.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        # A cold build, with the shared cache unreachable, takes over 8 minutes on macOS.
        timeout-minutes: 20
        uses: wow-look-at-my/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -v
          windows: cd src && .\make.bat -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - uses: ./.github/actions/build-leg

  # The ubuntu build leg, its own job so cosmo-checks, wasm and wasm-suite take its toolchain the moment it exists: needs waits on a whole matrix.
  build-linux:
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@common-checks#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      # cmd/go confines a dependency's generate directive with it, and fails the build when it is absent.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        timeout-minutes: 20
        shell: bash
        run: cd src && ./make.bash -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - uses: ./.github/actions/build-leg

  # The whole suite per host, in parts that run side by side; nothing downstream of a build waits on it.
  suite:
    timeout-minutes: 150
    needs: [build, build-linux]
    permissions:
      id-token: write
      contents: read
    strategy:
      # Every leg runs to the end and reports. One host's red says nothing about the other five, and a suite exists to name everything that is broken at once.
      fail-fast: false
      matrix:
        # NT is off: it is the longest leg by far. Put windows-latest back to run it again. waiver-expires: 2026-09-28
        suite-os: [ubuntu-latest, macos-latest]
        # dist test -shard: part 0 is the package tests, built once as one go test; part 1 is every other test. dats/checks/suite-shards.dats holds both lists whole.
        shard: [0, 1]
        shards: [2]
        # NT is the longest leg by far, so it is excluded rather than run. Drop this exclude to run it again. waiver-expires: 2026-09-28
        exclude:
          - suite-os: windows-latest

    runs-on: ${{ matrix.suite-os }}
    env:
      # cmd/go's script suite runs in full now that the linked tools resolve, and the darwin runner needs the longer package deadline.
      GO_TEST_TIMEOUT_SCALE: 2

    steps:
      # dist test links one APE per test package and the image leaves too little room on C: for that. It runs beside the checkout and the submodules, which want no room, rather than in front of them.
      - name: Make room for the suite (NT)
        id: make-room
        if: runner.os == 'Windows'
        background: true
        shell: pwsh
        run: |
          $gb = 1GB
          # Which drive has room decides whether this does anything: the workspace and RUNNER_TEMP are both on D:, and only the caches under the profile sit on C:.
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Free } | ForEach-Object {
            Write-Host ("before: {0}: {1:N1} GB free of {2:N1} GB" -f $_.Name, ($_.Free/$gb), (($_.Free + $_.Used)/$gb))
          }
          $before = (Get-PSDrive C).Free
          $junk = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\Microsoft SDKs\Android',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\Unity',
            'C:\Miniconda',
            'C:\Julia',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\Python',
            'C:\hostedtoolcache\windows\node'
          )
          # rd walks a tree one entry at a time. robocopy mirrors an empty directory over each tree with many threads instead, which frees the space and leaves a shell of empty directories nothing reads again.
          $empty = Join-Path $env:RUNNER_TEMP 'empty-for-mirror'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          # An unlink is an MFT update and those serialize per volume, so four trees at eight threads is past the point where more helps.
          $timings = $junk | Where-Object { Test-Path $_ } | ForEach-Object -Parallel {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            try { robocopy $using:empty $_ /MIR /MT:8 /R:0 /W:0 /NFL /NDL /NJH /NJS /NC /NS /NP *>$null } catch { }
            [pscustomobject]@{ Seconds = [math]::Round($clock.Elapsed.TotalSeconds, 1); Tree = $_ }
          } -ThrottleLimit 4
          $timings | Sort-Object Seconds -Descending | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host ("C: free {0:N1} GB, was {1:N1} GB" -f ((Get-PSDrive C).Free/$gb), ($before/$gb))
          exit 0

      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@common-checks#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      # run.bash rebuilds the cmd packages from this tree, so the suite tests the client source the build leg linked in.
      - uses: ./.github/actions/track-submodules
      # run.bash reaches the same sandboxed generate directives the build leg does.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      # The suite is what wants the room, so the deletion is joined here. wait-all takes no if, and a host that backgrounded nothing passes straight through.
      - name: Wait for the room the suite needs
        wait-all:

      - name: Take the toolchain its build leg built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-${{ runner.os }}
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # This image's gcc links libwinpthread as a DLL that lives in C:\mingw64\bin and nowhere else, so a binary carrying any cgo package reaches it through PATH alone and dies at load with 0xc0000135 once a test narrows PATH or hands a child an environment without one. The loader reads the system directory whatever the environment says, so a copy there is found by every binary, and the stdlib archives the suite links against were built before this step runs.
      - name: Put the mingw runtime where the loader always looks (NT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sys = Join-Path $env:SystemRoot 'System32'
          $copied = @()
          foreach ($dll in @('libwinpthread-1.dll', 'libgcc_s_seh-1.dll', 'libstdc++-6.dll')) {
            $src = Join-Path 'C:\mingw64\bin' $dll
            if (-not (Test-Path $src)) { continue }
            try { Copy-Item $src (Join-Path $sys $dll) -Force; $copied += $dll }
            catch { Write-Host "could not copy ${dll}: $($_.Exception.Message)" }
          }
          if ($copied.Count -eq 0) {
            Write-Host 'no mingw runtime went to the system directory; a test that narrows PATH will say so'
          } else {
            Write-Host "in ${sys}: $($copied -join ', ')"
          }

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) a=amd64 ;; aarch64) a=arm64 ;; *) echo "no loader for $(uname -m)" >&2; exit 1 ;; esac
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-$a"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # The suite says what a bare "exit status 2" from run.bat means.
      - name: A cosmo binary built here runs here (dats)
        if: runner.os != 'Windows'
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/host

      # The dats action runs a suite inside WSL on NT, which tests Linux. The host suites run on NT itself, which has no sandbox backend.
      - name: Download dats
        if: runner.os == 'Windows'
        id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
        with:
          project: dats

      - name: A cosmo binary built here runs here (dats, on NT)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATS_BIN: ${{ steps.dats.outputs.path }}
        run: |
          Copy-Item $env:DATS_BIN "$env:RUNNER_TEMP\dats.exe"
          & "$env:RUNNER_TEMP\dats.exe" -v --no-sandbox test dats/host
          exit $LASTEXITCODE

      # run.bat reports a bare "exit status 2" per package; one binary run by hand says why.
      - name: A cosmo test binary runs on this host
        if: matrix.build-os == 'windows-latest'
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          echo "GOOS=$(GOOS=cosmo go env GOOS) GOHOSTOS=$(go env GOHOSTOS) GOARCH=$(GOOS=cosmo go env GOARCH)"
          # fizzbuzz boots here and is fat; a test binary is thin, so build it both ways.
          for fat in 1 0; do
            GOCOSMOFAT=$fat GOOS=cosmo go build -o "$RUNNER_TEMP/fb$fat.com" testdata/fizzbuzz/fizzbuzz.go
            rc=0
            "$RUNNER_TEMP/fb$fat.com" 10 5 || rc=$?
            echo "fizzbuzz GOCOSMOFAT=$fat exit=$rc"
          done
          # The boot prints its milestones under -tags cosmontdebug, so a binary that dies before it can say anything still says how far it got. It exits 139 there, a fault rather than a throw.
          GOOS=cosmo go build -tags cosmontdebug -o "$RUNNER_TEMP/fbtrace.com" testdata/fizzbuzz/fizzbuzz.go
          rc=0
          out="$("$RUNNER_TEMP/fbtrace.com" 10 5 2>&1)" || rc=$?
          echo "fizzbuzz -tags cosmontdebug exit=$rc output=[$out]"
          # A child that loses its arguments ignores -test.run and forks forever; archive/tar is where that shows.
          GOOS=cosmo go build -o "$RUNNER_TEMP/argvecho.com" ./testdata/argvecho/main.go
          rc=0
          "$RUNNER_TEMP/argvecho.com" || rc=$?
          echo "argvecho exit=$rc"
          GOOS=cosmo go test -c -o "$RUNNER_TEMP/strings.test" strings
          ls -l "$RUNNER_TEMP/strings.test"
          # Three shapes: no arguments, a listing that never runs a test, and one test.
          for args in "" "-test.list=." "-test.run=TestLastIndexByte -test.v"; do
            rc=0
            "$RUNNER_TEMP/strings.test" $args > "$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
            echo "strings.test [$args] exit=$rc output:"
            cat "$RUNNER_TEMP/out.txt"
          done
          exit $rc

      - name: The whole test suite (run.bash)
        # the distribution's own all-tests entry point, on every host it builds on. tee feeds the timing step; `shell: bash` is -o pipefail, so a red suite still fails. see docs/CI.md.
        if: runner.os != 'Windows'
        shell: bash
        env:
          SUITE_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          sh "$GITHUB_WORKSPACE/.github/resource-log.sh" &
          probe=$!
          trap 'kill "$probe"' EXIT
          cd src && ./run.bash "-shard=$SUITE_SHARD" 2>&1 | tee "$RUNNER_TEMP/suite.log"

      # Strawberry's patch 2.5.9 leads PATH here and asserts partway through a two-file diff, which is what go mod tidy -diff writes. This picks one that applies such a diff, proven by applying one.
      - name: A patch that applies a multi-file diff (NT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'patchprobe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          # The lines the diff names end in a newline, so the files have to as well, and they are written byte for byte rather than through a cmdlet that would append CRLF.
          [IO.File]::WriteAllText("$probe\one.txt", "one`n")
          [IO.File]::WriteAllText("$probe\two.txt", "two`n")
          $diff = "--- a/one.txt`n+++ b/one.txt`n@@ -1 +1 @@`n-one`n+ONE`n--- a/two.txt`n+++ b/two.txt`n@@ -1 +1 @@`n-two`n+TWO`n"
          [IO.File]::WriteAllText("$probe\d.patch", $diff)
          $tried = @()
          foreach ($dir in @("$env:ProgramFiles\Git\usr\bin", 'C:\msys64\usr\bin', 'C:\Strawberry\c\bin')) {
            $exe = Join-Path $dir 'patch.exe'
            if (-not (Test-Path $exe)) { $tried += "$exe (absent)"; continue }
            Copy-Item "$probe\one.txt" "$probe\one.bak"; Copy-Item "$probe\two.txt" "$probe\two.bak"
            & $exe -p1 -i "$probe\d.patch" -d $probe *>$null
            $rc = $LASTEXITCODE
            $ok = ($rc -eq 0) -and ((Get-Content "$probe\one.txt") -eq 'ONE') -and ((Get-Content "$probe\two.txt") -eq 'TWO')
            Move-Item -Force "$probe\one.bak" "$probe\one.txt"; Move-Item -Force "$probe\two.bak" "$probe\two.txt"
            if ($ok) {
              Write-Host "patch that applies a two-file diff: $exe"
              $bin = Join-Path $env:RUNNER_TEMP 'patchbin'
              New-Item -ItemType Directory -Force -Path $bin | Out-Null
              Copy-Item $exe $bin -Force
              Get-ChildItem $dir -Filter '*.dll' | Where-Object { $_.Name -match '^(msys|cyg)' } | ForEach-Object { Copy-Item $_.FullName $bin -Force }
              $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              exit 0
            }
            $tried += "$exe (exit $rc, did not apply both hunks)"
          }
          Write-Host "no patch on this image applies a two-file diff, leaving PATH alone:`n$($tried -join "`n")"
          exit 0

      - name: The whole test suite (run.bat)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SUITE_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          # -NoNewWindow gives the probe this step's console, so its lines stream here as the suite runs.
          $probe = Start-Process pwsh -ArgumentList '-NoProfile', '-File', "$env:GITHUB_WORKSPACE/.github/resource-log.ps1" -NoNewWindow -PassThru
          try {
            cd src
            .\run.bat "-shard=$env:SUITE_SHARD" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/suite.log"
            $status = $LASTEXITCODE
          } finally {
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
          }
          exit $status

      - name: What the suite spent its time on
        # runs on a red suite too: the slow packages are most worth seeing when it failed. A missing log is a no-op, never a second failure.
        if: always()
        uses: wow-look-at-my/actions@typescript#latest
        env:
          SUITE_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        with:
          script: |
            const required = (name: string): string => {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is not set; the runner or this step's env provides it`);
              return value;
            };
            const summaryPath = required('GITHUB_STEP_SUMMARY');
            const logPath = `${required('RUNNER_TEMP')}/suite.log`;
            if (!fs.existsSync(logPath)) {
              core.info('no suite.log; nothing to report');
              return;
            }
            const rows = [];
            for (const line of fs.readFileSync(logPath, 'utf-8').split('\n')) {
              // dist test prints one of these per package it ran.
              const hit = /^ok\s+(\S+)\s+([0-9.]+)s/.exec(line);
              if (hit) rows.push({ pkg: hit[1], secs: Number(hit[2]) });
            }
            if (rows.length === 0) {
              core.info('no per-package timings found in suite.log');
              return;
            }
            rows.sort((left, right) => right.secs - left.secs);
            const total = rows.reduce((sum, row) => sum + row.secs, 0);
            const top = rows.slice(0, 30);
            const share = top.reduce((sum, row) => sum + row.secs, 0);
            const lines = [
              `### Suite timings (${required('RUNNER_OS')}, part ${required('SUITE_SHARD')})`,
              '',
              `${rows.length} packages, ${total.toFixed(1)}s of package time.`,
              `The 30 slowest are ${share.toFixed(1)}s of that (${((share / total) * 100).toFixed(0)}%).`,
              '',
              '| seconds | package |',
              '| ---: | --- |',
              ...top.map((row) => `| ${row.secs.toFixed(2)} | \`${row.pkg}\` |`),
            ];
            fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
            core.info(`recorded ${rows.length} package timings`);

  # Checks whose answer does not depend on the host. Each runs once, here, on the linux toolchain.
  cosmo-checks:
    timeout-minutes: 60
    needs: build-linux
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@secret-server#latest
      # embedded-std.dats rebuilds the go command from this tree, so the submodules carry their branch heads here too.
      - uses: ./.github/actions/track-submodules

      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        shell: bash
        run: |
          set -euo pipefail
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-amd64"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # apeld-reproducible.dats rebuilds the committed APE loaders with these; the tarball is pinned by digest so they cannot drift with a zig release.
      - name: Install the toolchain that builds the APE loaders
        shell: bash
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld-18 llvm-18
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          echo "LLD=/usr/lib/llvm-18/bin/ld64.lld" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip-18" >> "$GITHUB_ENV"

      # Every host-independent suite. Which tests each covers is the suite's decision, not this file's.
      - name: The dats suites
        timeout-minutes: 45
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/checks

  # Test all APE binaries on each platform using Go tests -- see docs/CI.md "test job".
  test:
    # NT links more and links it slower, so it gets 40 minutes where the others get 25.
    timeout-minutes: ${{ matrix.test-os == 'windows-latest' && 40 || 25 }}
    needs: [build, build-linux]
    strategy:
      fail-fast: true
      matrix:
        test-os: [ubuntu-latest, macos-latest, windows-latest]
        # NT is the longest leg by far, so it is excluded rather than run. Drop this exclude to run it again. waiver-expires: 2026-09-28
        exclude:
          - test-os: windows-latest

    runs-on: ${{ matrix.test-os }}

    steps:
      - name: Checkout code (for Go tests)
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: wow-look-at-my/actions@common-checks#latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download the ubuntu-origin APE binaries
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-Linux
          path: binaries/ape-binary-Linux

      - name: Download the macOS-origin APE binaries
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-macOS
          path: binaries/ape-binary-macOS

      # Only an NT leg produces this origin, and only NT's own apetest case reads it.
      - name: Download the windows-origin APE binaries
        if: matrix.test-os == 'windows-latest'
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-Windows
          path: binaries/ape-binary-Windows

      # Prefetched separately so a stalled module download can't masquerade as a hung test step.
      - name: Download apetest modules
        timeout-minutes: 3
        shell: bash
        run: |
          cd testdata/ape/apetest
          sh ./with-deadline.sh 150 go mod download

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) a=amd64 ;; aarch64) a=arm64 ;; *) echo "no loader for $(uname -m)" >&2; exit 1 ;; esac
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-$a"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # apetest per origin then the subsets, and the read-only boot. readonly-boot is unix-only: NTFS ignores the mode bit it relies on, and nt.dats carries that claim for NT.
      - name: The APE binaries run on this host (dats)
        if: matrix.test-os != 'windows-latest'
        timeout-minutes: 45
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/test/apetest.dats dats/test/readonly-boot.dats

      # The container shape is built from mount namespaces, so it is linux only.
      - name: An APE runs in a read-only container (dats)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/test/readonly-boot-container.dats

      # The dats action runs a suite inside WSL on NT, which tests Linux. These suites are about NT itself, which has no sandbox backend.
      - name: Download dats
        if: matrix.test-os == 'windows-latest'
        id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
        with:
          project: dats

      - name: The APE binaries run on this host, and the NT host suite (dats, on NT)
        if: matrix.test-os == 'windows-latest'
        timeout-minutes: 45
        shell: pwsh
        env:
          DATS_BIN: ${{ steps.dats.outputs.path }}
        run: |
          Copy-Item $env:DATS_BIN "$env:RUNNER_TEMP\dats.exe"
          & "$env:RUNNER_TEMP\dats.exe" -v --no-sandbox test dats/test/apetest.dats dats/test/nt.dats
          exit $LASTEXITCODE

  # Regression-gate the WebAssembly ports (GOOS=js and GOOS=wasip1) -- see docs/WASM.md and docs/CI.md "wasm job".
  wasm:
    # Off while the wasip1 suite recompiles its modules and starves the queue; flip the condition back to re-enable. waiver-expires: 2026-09-21
    if: ${{ false }}
    timeout-minutes: 45
    needs: build-linux
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # wasm_exec_node.js (the js/wasm exec wrapper in lib/wasm) requires node >= 18.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wazero (wasip1 runtime)
        # Runs before the fork toolchain is built so `go` is unambiguously the setup-go bootstrap -- see docs/CI.md "wasm job".
        timeout-minutes: 5
        shell: bash
        run: GOOS=linux GOARCH=amd64 GOBIN="$RUNNER_TEMP/wasibin" go install github.com/tetratelabs/wazero/cmd/wazero@v1.12.0 && sudo install -m 0755 "$RUNNER_TEMP/wasibin/wazero" /usr/local/bin/wazero

      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # Every wasm suite: std for both ports, the object writer, the node and wasip1sock transports, wasmexport and GOWASM=threads.
      - name: The wasm dats suites
        timeout-minutes: 40
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/wasm

  # The whole test suite for each wasm port, the gate the other ports get -- see docs/CI.md "wasm-suite job".
  wasm-suite:
    # Off while the wasip1 suite recompiles its modules and starves the queue; flip the condition back to re-enable. waiver-expires: 2026-09-21
    if: ${{ false }}
    timeout-minutes: 60
    needs: build-linux
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        port: [js, wasip1]
        # The same dist test parts as the suite job.
        shard: [0, 1]
        shards: [2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Node.js
        if: matrix.port == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wasmtime (wasip1 runtime)
        # The exec wrapper's default engine, at the release upstream's wasip1 builder pins: v15 onward answers a FIFO read with ESPIPE (wasitest TestNonblock), and wazero sits 10 pages over test/wasmmemsize's ceiling.
        if: matrix.port == 'wasip1'
        timeout-minutes: 5
        shell: bash
        run: curl -sSfL https://wasmtime.dev/install.sh | bash -s -- --version v14.0.4

      # wasmtime compiles each test binary's module before running it, and that compile is most of a cheap package: sort.test costs 2.53s cold against 1.05s warm.
      - name: Keep the compiled wasm modules between runs
        if: matrix.port == 'wasip1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-modules-${{ matrix.port }}-${{ matrix.shard }}of${{ matrix.shards }}-${{ github.sha }}
          restore-keys: wasmtime-modules-${{ matrix.port }}-${{ matrix.shard }}of${{ matrix.shards }}-


      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      - name: The whole test suite (dist test)
        # Actions withholds this job's log for the hour it runs, so the command streams live instead.
        uses: wow-look-at-my/log-streamer/.github/actions/stream@master
        with:
          stream-key: ${{ secrets.LOG_STREAMER_STREAM_KEY }}
          name: ${{ matrix.port }}-${{ matrix.shard }}of${{ matrix.shards }}
          run: |
            set -o pipefail
            export PATH="$PWD/bin:$PWD/lib/wasm:$HOME/.wasmtime/bin:$PATH"
            sh ./.github/resource-log.sh &
            probe=$!
            # the stream client reads until every holder of its pipe exits, so the probe goes when this script does.
            trap 'kill "$probe"' EXIT
            GOOS=${{ matrix.port }} GOARCH=wasm stdbuf -oL -eL go tool dist test -shard=${{ matrix.shard }}/${{ matrix.shards }} 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: What ${{ matrix.port }} part ${{ matrix.shard }} of ${{ matrix.shards }} spent its time on
        # the per-package times are how the js and wasip1 ports get compared, and how a leg that overruns its budget names what overran.
        if: always()
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const required = (name: string): string => {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is not set; the runner or this step's env provides it`);
              return value;
            };
            const summaryPath = required('GITHUB_STEP_SUMMARY');
            const logPath = `${required('RUNNER_TEMP')}/suite.log`;
            const port = required('WASM_PORT');
            if (!fs.existsSync(logPath)) {
              core.info('no suite.log; nothing to report');
              return;
            }
            const rows = [];
            for (const line of fs.readFileSync(logPath, 'utf-8').split('\n')) {
              // dist test prints one of these per package it ran.
              const hit = /^ok\s+(\S+)\s+([0-9.]+)s/.exec(line);
              if (hit) rows.push({ pkg: hit[1], secs: Number(hit[2]) });
            }
            if (rows.length === 0) {
              core.info('no per-package timings found in suite.log');
              return;
            }
            rows.sort((left, right) => right.secs - left.secs);
            const total = rows.reduce((sum, row) => sum + row.secs, 0);
            const top = rows.slice(0, 40);
            const lines = [
              `### ${port} suite timings`,
              '',
              `${rows.length} packages, ${total.toFixed(1)}s of package time.`,
              '',
              '| seconds | package |',
              '| ---: | --- |',
              ...top.map((row) => `| ${row.secs.toFixed(2)} | \`${row.pkg}\` |`),
            ];
            fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
            core.info(`${port}: recorded ${rows.length} package timings, ${total.toFixed(1)}s total`);
        env:
          WASM_PORT: ${{ matrix.port }} part ${{ matrix.shard }}/${{ matrix.shards }}


  # Publishes an installable toolchain distribution to buildhost on every green push -- see docs/CI.md "publish jobs".
  publish-create:
    timeout-minutes: 10
    # Switching the wasm legs back on goes with putting them back here: a needed job reporting `skipped` skips this one.
    needs: [source-checks, build, build-linux, suite, cosmo-checks, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token buildhost authenticates
      contents: read
      artifact-metadata: write
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create buildhost release
        # No version input: buildhost auto-increments it. See docs/CI.md "publish jobs".
        id: release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-create-release@master
        with:
          project: gosmopolitan

  # Uploading is generic work, so it takes the cheapest runner. Each build leg packaged its own archive; this job only moves them to buildhost.
  publish-upload:
    timeout-minutes: 15
    needs: publish-create
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # NT is off, so a release carries no windows archive. Put the entry back to ship one. waiver-expires: 2026-09-28
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Take the archive its build leg packaged
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: distpack-${{ matrix.goos }}-${{ matrix.goarch }}
          path: distpack

      # buildhost-upload-artifact takes an exact file path, and the name carries the version the build leg stamped.
      - name: Locate distribution tarball
        id: tarball
        uses: wow-look-at-my/actions@typescript#latest
        env:
          DIST_SUFFIX: ${{ matrix.goos }}-${{ matrix.goarch }}
        with:
          script: |
            const distDir = 'distpack';
            const suffix = `.${process.env.DIST_SUFFIX}.tar.gz`;
            const names = fs.readdirSync(distDir).filter((f) => f.startsWith('go') && f.endsWith(suffix));
            if (names.length !== 1) {
              throw new Error(`want exactly one go*${suffix} in ${distDir}, ` +
                `found [${names.join(', ')}] among [${fs.readdirSync(distDir).join(', ')}]`);
            }
            const tarball = path.posix.join(distDir, names[0]);
            core.info(`${tarball}: ${fs.statSync(tarball).size} bytes`);
            core.setOutput('path', tarball);
            core.setOutput('name', names[0]);

      - name: Upload toolchain tarball
        timeout-minutes: 10
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-upload-artifact@master
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          kind: archive
          path: ${{ steps.tarball.outputs.path }}
          filename: ${{ steps.tarball.outputs.name }}

      - name: Log uploaded artifact
        shell: bash
        run: |
          echo "::notice::uploaded ${{ steps.tarball.outputs.name }} to gosmopolitan v${{ needs.publish-create.outputs.version }} (${{ matrix.goos }}/${{ matrix.goarch }})"

  publish-finish:
    timeout-minutes: 10
    needs: [publish-create, publish-upload]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Publish buildhost release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-release@master
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}

      - name: Log published release
        shell: bash
        run: |
          v='${{ needs.publish-create.outputs.version }}'
          b='${{ github.ref_name }}'
          echo "::notice::published gosmopolitan v$v for linux/amd64 and darwin/arm64"
          echo "::notice::linux:  https://dl.pazer.build/gosmopolitan?branch=$b&os=linux&arch=amd64"
          echo "::notice::darwin: https://dl.pazer.build/gosmopolitan?branch=$b&os=darwin&arch=arm64"
