# CI workflow for GOOS=cosmo cross-platform testing -- see CLAUDE.md "CI"

name: Cosmopolitan Cross-Platform CI

on:
  push:
    # matches every branch and no tag, so a tag push does not re-enter this workflow.
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Every check that reads the tree and nothing else. It waits on no build, so a violation is named within the minute.
  source-checks:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 20 || 10 }}
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@no-all-builds-job#latest
      - uses: wow-look-at-my/slopfix@lkgb
      - uses: wow-look-at-my/actions@no-tests-in-yaml#latest
      - uses: wow-look-at-my/actions@push-excludes-tags#latest
      - uses: wow-look-at-my/actions@ste-lint#latest

      - name: The source suites
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: dats/source

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest

  # Build Go toolchain and APE test binary on each build platform -- see docs/CI.md "build job".
  build:
    # make.bash plus the APE builds; the suite is its own job.
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 90 || 45 }}
    permissions:
      id-token: write
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        build-os: [macos-latest, windows-latest]

    if: github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.build-os }}

    steps:
      # The track-submodules step checks out the submodules. Without the ones under src/cmd/vendor, cmd/go cannot build.
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
      - uses: wow-look-at-my/actions@disable-windows-defender#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      # Linux confines a dependency's generate directive with it; macOS uses seatbelt and needs nothing.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # make.bat and make.bash compile the APE loaders with these.
      - uses: ./.github/actions/apeld-tools

      # toolchain1 and toolchain2 build with no shared cache. Kept, they take 2.4s instead of 88s.
      - name: Restore the bootstrap build cache
        uses: actions/cache/restore@v4
        with:
          path: pkg/obj/go-build
          key: dist-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: dist-bootstrap-${{ runner.os }}-${{ runner.arch }}-
      - name: Count the bootstrap build cache
        id: bootstrap-before
        shell: bash
        run: echo "files=$(find pkg/obj/go-build -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Build Go toolchain
        # A cold build, with the shared cache unreachable, takes over 8 minutes on macOS.
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 40 || 20 }}
        uses: wow-look-at-my/actions/multicmd@lkgb
        with:
          unix: cd src && ./make.bash -v
          windows: cd src && .\make.bat -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}
          # The track-submodules step put every org submodule on its branch head. dist runs the same script again otherwise, 35s on NT.
          GOSUBMODULEBRANCH: 'off'

      # A read refreshes an entry's mtime once it is an hour old, so an entry older than 90 minutes is one this build never read.
      - name: Count the bootstrap build cache after the build
        id: bootstrap-after
        shell: bash
        run: |
          echo "before: ${{ steps.bootstrap-before.outputs.files }} files"
          find pkg/obj/go-build -type f -mmin +90 -delete
          files="$(find pkg/obj/go-build -type f | wc -l)"
          echo "after the prune: $files files, $(du -sk pkg/obj/go-build | cut -f1) KB"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      # The upload takes up to a minute. A build that added no entry and trimmed none has nothing new to keep.
      - name: Keep the bootstrap build cache between runs
        if: steps.bootstrap-before.outputs.files != steps.bootstrap-after.outputs.files
        uses: actions/cache/save@v4
        with:
          path: pkg/obj/go-build
          key: dist-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - uses: ./.github/actions/build-leg

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest

  # The ubuntu build leg, its own job so cosmo-checks, wasm and wasm-suite take its toolchain the moment it exists: needs waits. On a whole matrix.
  build-linux:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 90 || 45 }}
    permissions:
      id-token: write
      contents: read
      actions: write
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
      - uses: wow-look-at-my/actions@disable-windows-defender#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      # cmd/go confines a dependency's generate directive with it, and fails the build when it is absent.
      - uses: wow-look-at-my/actions@bubblewrap#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # make.bash compiles the APE loaders with these.
      - uses: ./.github/actions/apeld-tools

      # toolchain1 and toolchain2 build with no shared cache. Kept, they take 2.4s instead of 88s.
      - name: Restore the bootstrap build cache
        uses: actions/cache/restore@v4
        with:
          path: pkg/obj/go-build
          key: dist-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: dist-bootstrap-${{ runner.os }}-${{ runner.arch }}-
      - name: Count the bootstrap build cache
        id: bootstrap-before
        shell: bash
        run: echo "files=$(find pkg/obj/go-build -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Build Go toolchain
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 40 || 20 }}
        shell: bash
        run: cd src && ./make.bash -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}
          # The track-submodules step put every org submodule on its branch head. dist runs the same script again otherwise, 35s on NT.
          GOSUBMODULEBRANCH: 'off'

      # A read refreshes an entry's mtime once it is an hour old, so an entry older than 90 minutes is one this build never read.
      - name: Count the bootstrap build cache after the build
        id: bootstrap-after
        shell: bash
        run: |
          echo "before: ${{ steps.bootstrap-before.outputs.files }} files"
          find pkg/obj/go-build -type f -mmin +90 -delete
          files="$(find pkg/obj/go-build -type f | wc -l)"
          echo "after the prune: $files files, $(du -sk pkg/obj/go-build | cut -f1) KB"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      # The upload takes up to a minute. A build that added no entry and trimmed none has nothing new to keep.
      - name: Keep the bootstrap build cache between runs
        if: steps.bootstrap-before.outputs.files != steps.bootstrap-after.outputs.files
        uses: actions/cache/save@v4
        with:
          path: pkg/obj/go-build
          key: dist-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - uses: ./.github/actions/build-leg

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest

  # The whole suite per host, one leg each; nothing downstream of a build waits on it.
  suite:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 600 || 300 }}
    needs: [build, build-linux]
    permissions:
      id-token: write
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        suite-os: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}

    runs-on: ${{ (github.event.repository.visibility == 'public' || !contains(fromJSON('["ubuntu-latest"]'), matrix.suite-os)) && matrix.suite-os || vars.CI_RUNNER || matrix.suite-os }}
    env:
      # cmd/go's script suite runs in full now that the linked tools resolve, and the darwin runner needs the longer package deadline.
      GO_TEST_TIMEOUT_SCALE: 2

    steps:
      # dist test links one APE per test package, and C: has too little room for that. D: holds the workspace and RUNNER_TEMP with room to spare, so the temp files and the Go caches go there too.
      - name: Put the suite's temp files and Go caches on the D drive (NT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'suite'
          $dirs = @{ TEMP = 'tmp'; TMP = 'tmp'; GOTMPDIR = 'tmp'; GOCACHE = 'go-build'; GOPATH = 'gopath' }
          foreach ($name in $dirs.Keys) {
            $dir = Join-Path $root $dirs[$name]
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            "$name=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Get-PSDrive C, D | ForEach-Object { Write-Host ("{0}: {1:N1} GB free" -f $_.Name, ($_.Free/1GB)) }

      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
      - uses: wow-look-at-my/actions@disable-windows-defender#latest
      - uses: wow-look-at-my/actions@secret-server#latest
      # run.bash rebuilds the cmd packages from this tree, so the suite tests the client source the build leg linked in.
      - uses: ./.github/actions/track-submodules
      # run.bash reaches the same sandboxed generate directives the build leg does.
      - uses: wow-look-at-my/actions@bubblewrap#latest
      # TestRepeatBootstrap runs make.bash again, which compiles the APE loaders with these.
      - uses: ./.github/actions/apeld-tools

      - name: Take the toolchain its build leg built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-${{ runner.os }}
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # The dats sandbox mounts .git read-only, so git status there cannot run the LFS clean filter on a file the restore rewrote.
      - name: Refresh the index here, where .git is writable
        shell: bash
        run: git update-index -q --ignore-submodules --refresh

      # Consider this image's gcc links. Those links libwinpthread as a DLL that lives in C:\mingw64\bin and nowhere else. A binary carrying any cgo package reaches it through PATH alone and dies at load with 0xc0000135 once a test narrows PATH. It hands a child an environment without one. The loader reads the system directory whatever the environment says. A copy there is found by every binary, and the stdlib archives the suite links against were built before this step runs.
      - name: Put the mingw runtime where the loader always looks (NT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sys = Join-Path $env:SystemRoot 'System32'
          $copied = @()
          foreach ($dll in @('libwinpthread-1.dll', 'libgcc_s_seh-1.dll', 'libstdc++-6.dll')) {
            $src = Join-Path 'C:\mingw64\bin' $dll
            if (-not (Test-Path $src)) { continue }
            try { Copy-Item $src (Join-Path $sys $dll) -Force; $copied += $dll }
            catch { Write-Host "could not copy ${dll}: $($_.Exception.Message)" }
          }
          if ($copied.Count -eq 0) {
            Write-Host 'no mingw runtime went to the system directory; a test that narrows PATH will say so'
          } else {
            Write-Host "in ${sys}: $($copied -join ', ')"
          }

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) a=amd64 ;; aarch64) a=arm64 ;; *) echo "no loader for $(uname -m)" >&2; exit 1 ;; esac
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-$a"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # The suite says what a bare "exit status 2" from run.bat means.
      - name: A cosmo binary built here runs here (dats)
        if: runner.os != 'Windows'
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: dats/host

      # The dats action runs a suite inside WSL on NT, which tests Linux. The host suites run on NT itself, which has no sandbox backend.
      - name: Download dats
        if: runner.os == 'Windows'
        id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          project: dats

      - name: A cosmo binary built here runs here (dats, on NT)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATS_BIN: ${{ steps.dats.outputs.path }}
        run: |
          Copy-Item $env:DATS_BIN "$env:RUNNER_TEMP\dats.exe"
          & "$env:RUNNER_TEMP\dats.exe" -v --no-sandbox test dats/host
          exit $LASTEXITCODE

      # The runner's forwarder at 192.168.64.1 answers an NXDOMAIN query late or never, which net's TestLookupNoSuchHost reads as a timeout. Public resolvers answer it at once, and the last dig proves the system resolver now does too.
      - name: A resolver that answers NXDOMAIN (darwin)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "before:"
          scutil --dns | grep -E 'nameserver\[0\]' || true
          networksetup -listallnetworkservices | while IFS= read -r service; do
            case "$service" in 'An asterisk'*|'*'*) continue ;; esac
            sudo networksetup -setdnsservers "$service" 1.1.1.1 8.8.8.8 || echo "no DNS setting on $service"
          done
          echo "after:"
          scutil --dns | grep -E 'nameserver\[0\]'
          grep nameserver /etc/resolv.conf
          dig +time=3 +tries=1 invalid.invalid. @1.1.1.1 | grep -E 'status: NXDOMAIN'
          dig +time=3 +tries=1 invalid.invalid. | grep -E 'status: NXDOMAIN'

      # The suite profile records every process's CPU and samples call stacks system-wide.
      - name: Profiling tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y -qq acct linux-tools-common "linux-tools-$(uname -r)"

      - name: The whole test suite (run.bash)
        # the distribution's own all-tests entry point, on every host it builds on. tee feeds the timing step; `shell: bash` is -o pipefail, so a red suite still fails. see docs/CI.md.
        id: suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh "$GITHUB_WORKSPACE/.github/resource-log.sh" &
          probe=$!
          trap 'kill "$probe"' EXIT
          if [ "$RUNNER_OS" = Linux ]; then
            bash misc/suiteprof/profile-suite.bash "${{ runner.temp }}/suiteprof" | tee "${{ runner.temp }}/suite.log"
          else
            cd src && ./run.bash 2>&1 | tee "${{ runner.temp }}/suite.log"
          fi

      # profile-suite.bash writes the report once it starts, so a suite step that ran has one, and a step that never started has none.
      - name: Where the suite spent its CPU (Linux)
        if: always() && runner.os == 'Linux' && contains(fromJSON('["success","failure","cancelled"]'), steps.suite.outcome)
        shell: bash
        run: cat "${{ runner.temp }}/suiteprof/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Strawberry's patch 2.5.9 leads PATH here and asserts partway through a two-file diff, which is what go mod tidy -diff writes. This picks one that applies such a diff, proven by applying one.
      - name: A patch that applies a multi-file diff (NT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'patchprobe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          # The lines the diff names end in a newline, so the files have to as well, and they are written byte for byte rather than through a cmdlet that would append CRLF.
          [IO.File]::WriteAllText("$probe\one.txt", "one`n")
          [IO.File]::WriteAllText("$probe\two.txt", "two`n")
          $diff = "--- a/one.txt`n+++ b/one.txt`n@@ -1 +1 @@`n-one`n+ONE`n--- a/two.txt`n+++ b/two.txt`n@@ -1 +1 @@`n-two`n+TWO`n"
          [IO.File]::WriteAllText("$probe\d.patch", $diff)
          $tried = @()
          foreach ($dir in @("$env:ProgramFiles\Git\usr\bin", 'C:\msys64\usr\bin', 'C:\Strawberry\c\bin')) {
            $exe = Join-Path $dir 'patch.exe'
            if (-not (Test-Path $exe)) { $tried += "$exe (absent)"; continue }
            Copy-Item "$probe\one.txt" "$probe\one.bak"; Copy-Item "$probe\two.txt" "$probe\two.bak"
            & $exe -p1 -i "$probe\d.patch" -d $probe *>$null
            $rc = $LASTEXITCODE
            $ok = ($rc -eq 0) -and ((Get-Content "$probe\one.txt") -eq 'ONE') -and ((Get-Content "$probe\two.txt") -eq 'TWO')
            Move-Item -Force "$probe\one.bak" "$probe\one.txt"; Move-Item -Force "$probe\two.bak" "$probe\two.txt"
            if ($ok) {
              Write-Host "patch that applies a two-file diff: $exe"
              $bin = Join-Path $env:RUNNER_TEMP 'patchbin'
              New-Item -ItemType Directory -Force -Path $bin | Out-Null
              Copy-Item $exe $bin -Force
              Get-ChildItem $dir -Filter '*.dll' | Where-Object { $_.Name -match '^(msys|cyg)' } | ForEach-Object { Copy-Item $_.FullName $bin -Force }
              $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              exit 0
            }
            $tried += "$exe (exit $rc, did not apply both hunks)"
          }
          Write-Host "no patch on this image applies a two-file diff, leaving PATH alone:`n$($tried -join "`n")"
          exit 0

      - name: The whole test suite (run.bat)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A test that reads PATH misses the test cache when PATH differs from the last run's, so the log names it.
          Write-Host "PATH=$env:Path"
          # -NoNewWindow gives the probe this step's console, so its lines stream here as the suite runs.
          $probe = Start-Process pwsh -ArgumentList '-NoProfile', '-File', "$env:GITHUB_WORKSPACE/.github/resource-log.ps1" -NoNewWindow -PassThru
          # A test that reads bin\go.exe keys its cached result on these bytes, so the log shows whether the suite rewrote them.
          Get-FileHash bin\go.exe | ForEach-Object { Write-Host "before the suite: $($_.Hash) bin\go.exe" }
          try {
            cd src
            .\run.bat 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/suite.log"
            $status = $LASTEXITCODE
          } finally {
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
          }
          Get-FileHash ..\bin\go.exe | ForEach-Object { Write-Host "after the suite: $($_.Hash) bin\go.exe" }
          exit $status

      - name: Test coverage, and what the suite spent its time on
        # runs on a red suite too: the slow packages are most worth seeing when it failed. A missing log is a no-op, never a second failure.
        if: always()
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const required = (name: string): string => {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is not set; the runner or this step's env provides it`);
              return value;
            };
            const summaryPath = required('GITHUB_STEP_SUMMARY');
            const logPath = `${required('RUNNER_TEMP')}/suite.log`;
            if (!fs.existsSync(logPath)) {
              core.info('no suite.log; nothing to report');
              return;
            }
            const logLines = fs.readFileSync(logPath, 'utf-8').split(/\r?\n/);
            // dist test ends with this block, ahead of its verdict line.
            const coverageAt = logLines.indexOf('##### Test coverage');
            if (coverageAt < 0) {
              core.error('suite.log has no "##### Test coverage" block; dist test stopped before it measured coverage');
            } else {
              const block = [`### Test coverage (${required('RUNNER_OS')})`];
              for (const line of logLines.slice(coverageAt + 1)) {
                if (/^(FAILED|ALL TESTS PASSED|NO TESTS TO RUN)/.test(line)) break;
                block.push(line);
              }
              fs.appendFileSync(summaryPath, block.join('\n').trimEnd() + '\n\n');
            }
            const rows = [];
            for (const line of logLines) {
              // dist test prints one of these per package it ran.
              const hit = /^ok\s+(\S+)\s+([0-9.]+)s/.exec(line);
              if (hit) rows.push({ pkg: hit[1], secs: Number(hit[2]) });
            }
            if (rows.length === 0) {
              core.info('no per-package timings found in suite.log');
              return;
            }
            rows.sort((left, right) => right.secs - left.secs);
            const total = rows.reduce((sum, row) => sum + row.secs, 0);
            const top = rows.slice(0, 30);
            const share = top.reduce((sum, row) => sum + row.secs, 0);
            const lines = [
              `### Suite timings (${required('RUNNER_OS')})`,
              '',
              `${rows.length} packages, ${total.toFixed(1)}s of package time.`,
              `The 30 slowest are ${share.toFixed(1)}s of that (${((share / total) * 100).toFixed(0)}%).`,
              '',
              '| seconds | package |',
              '| ---: | --- |',
              ...top.map((row) => `| ${row.secs.toFixed(2)} | \`${row.pkg}\` |`),
            ];
            fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
            core.info(`recorded ${rows.length} package timings`);

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest

  # Checks whose answer does not depend on the host. Each runs once, here, on the linux toolchain.
  cosmo-checks:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 120 || 60 }}
    needs: build-linux
    permissions:
      id-token: write
      contents: read
      actions: write
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
      - uses: wow-look-at-my/actions@secret-server#latest
      # embedded-std.dats rebuilds the go command from this tree, so the submodules carry their branch heads here too.
      - uses: ./.github/actions/track-submodules

      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      # The restore rewrites LFS files, and a sandboxed git cannot run the LFS clean filter on a read-only .git.
      - name: Refresh the git index after the restore
        shell: bash
        run: git update-index -q --refresh

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # The dats sandbox mounts .git read-only, so git status there cannot run the LFS clean filter on a file the restore rewrote.
      - name: Refresh the index here, where .git is writable
        shell: bash
        run: git update-index -q --ignore-submodules --refresh

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        shell: bash
        run: |
          set -euo pipefail
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-amd64"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # cosmo-cgo.dats compiles C for both cosmo architectures and runs the arm64 payload under qemu.
      - uses: ./.github/actions/cosmocc
      - name: Install qemu-user
        shell: bash
        run: sudo apt-get install -y -qq qemu-user

      # Every host-independent suite. Which tests each covers is the suite's decision, not this file's.
      - name: The dats suites
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 90 || 45 }}
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: dats/checks

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest

  # Test all APE binaries on each platform using Go tests -- see docs/CI.md "test job".
  test:
    # NT links more and links it slower, so it gets 40 minutes where the others get 25.
    timeout-minutes: ${{ matrix.test-os == 'windows-latest' && (github.ref == 'refs/heads/master' && 80 || 40) || (github.ref == 'refs/heads/master' && 50 || 25) }}
    needs: [build, build-linux]
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        test-os: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}

    runs-on: ${{ (github.event.repository.visibility == 'public' || !contains(fromJSON('["ubuntu-latest"]'), matrix.test-os)) && matrix.test-os || vars.CI_RUNNER || matrix.test-os }}

    steps:
      - name: Checkout code (for Go tests)
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
      - run: bash ./src/submodulefetch.bash
        shell: bash

      - uses: wow-look-at-my/actions@disable-windows-defender#latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download the ubuntu-origin APE binaries
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-Linux
          path: binaries/ape-binary-Linux

      - name: Download the macOS-origin APE binaries
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-macOS
          path: binaries/ape-binary-macOS

      # Only an NT leg produces this origin, and only NT's own apetest case reads it.
      - name: Download the windows-origin APE binaries
        if: matrix.test-os == 'windows-latest'
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-binary-Windows
          path: binaries/ape-binary-Windows

      # Prefetched separately so a stalled module download can't masquerade as a hung test step.
      - name: Download apetest modules
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 6 || 3 }}
        shell: bash
        run: |
          cd testdata/ape/apetest
          sh ./with-deadline.sh 150 go mod download

      # This job builds no toolchain, so the loaders come from the build leg that compiled them, to where a toolchain keeps them.
      - name: Put the APE loaders where the toolchain keeps them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/cmd/link/internal/ld/apeld/bin
          cp binaries/ape-binary-${{ runner.os }}/apeld/apeld-* src/cmd/link/internal/ld/apeld/bin/
          ls -l src/cmd/link/internal/ld/apeld/bin

      # An APE starts through its loader, and execve of one reaches the loader only through this entry. F pre-opens it, so the path stops mattering.
      - name: Let the kernel exec an APE directly
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) a=amd64 ;; aarch64) a=arm64 ;; *) echo "no loader for $(uname -m)" >&2; exit 1 ;; esac
          l="$PWD/src/cmd/link/internal/ld/apeld/bin/apeld-linux-$a"
          test -x "$l"
          sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc 2>/dev/null || true
          printf ':APE:M::MZqFpD=\x27::%s:F' "$l" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          cat /proc/sys/fs/binfmt_misc/APE

      # apetest per origin then the subsets, and the read-only boot. readonly-boot is unix-only: NTFS ignores the mode bit it relies on, and nt.dats carries that claim for NT.
      - name: The APE binaries run on this host (dats)
        if: matrix.test-os != 'windows-latest'
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 90 || 45 }}
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: dats/test/apetest.dats dats/test/readonly-boot.dats

      # The container suite runs the boot script under busybox as well as dash.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y busybox-static
      # The container shape is built from mount namespaces, so it is linux only.
      - name: An APE runs in a read-only container (dats)
        if: runner.os == 'Linux'
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 20 || 10 }}
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: dats/test/readonly-boot-container.dats

      # The dats action runs a suite inside WSL on NT, which tests Linux. These suites are about NT itself, which has no sandbox backend.
      - name: Download dats
        if: matrix.test-os == 'windows-latest'
        id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          project: dats

      - name: The APE binaries run on this host, and the NT host suite (dats, on NT)
        if: matrix.test-os == 'windows-latest'
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 90 || 45 }}
        shell: pwsh
        env:
          DATS_BIN: ${{ steps.dats.outputs.path }}
        run: |
          Copy-Item $env:DATS_BIN "$env:RUNNER_TEMP\dats.exe"
          & "$env:RUNNER_TEMP\dats.exe" -v --no-sandbox test dats/test/apetest.dats dats/test/nt.dats
          exit $LASTEXITCODE

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest

  # Regression-gate the WebAssembly ports (GOOS=js and GOOS=wasip1) -- see docs/WASM.md and docs/CI.md "wasm job".
  wasm:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 90 || 45 }}
    needs: build-linux
    permissions:
      id-token: write
      contents: read
      actions: write
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # wasm_exec_node.js (the js/wasm exec wrapper in lib/wasm) requires node >= 18.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wazero (wasip1 runtime)
        # Runs before the fork toolchain is built so `go` is unambiguously the setup-go bootstrap -- see docs/CI.md "wasm job".
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 10 || 5 }}
        shell: bash
        run: GOOS=linux GOARCH=amd64 GOBIN="${{ runner.temp }}/wasibin" go install github.com/tetratelabs/wazero/cmd/wazero@v1.12.0 && sudo install -m 0755 "${{ runner.temp }}/wasibin/wazero" /usr/local/bin/wazero

      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # The dats sandbox mounts .git read-only, so git status there cannot run the LFS clean filter on a file the restore rewrote.
      - name: Refresh the index here, where .git is writable
        shell: bash
        run: git update-index -q --ignore-submodules --refresh

      # Every wasm suite: std for both ports, the object writer, the node and wasip1sock transports, wasmexport and GOWASM=threads.
      - name: The wasm dats suites
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 80 || 40 }}
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: dats/wasm

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest

  # The whole test suite for each wasm port, the gate the other ports get -- see docs/CI.md "wasm-suite job".
  wasm-suite:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 240 || 120 }}
    needs: build-linux
    permissions:
      id-token: write
      contents: read
      actions: write
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: true
      matrix:
        port: [js, wasip1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: ./.github/actions/track-submodules

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Node.js
        if: matrix.port == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wasmtime (wasip1 runtime)
        # The exec wrapper's default engine, at the release upstream's wasip1 builder pins: v15 onward answers a FIFO read with ESPIPE (wasitest TestNonblock), and wazero sits 10 pages. Over test/wasmmemsize's ceiling.
        if: matrix.port == 'wasip1'
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 10 || 5 }}
        shell: bash
        run: curl -sSfL https://wasmtime.dev/install.sh | bash -s -- --version v14.0.4

      # wasmtime compiles each test binary's module before running it. That compile is most of a cheap package: sort.test costs 2.53s cold against 1.05s warm. Every branch reads the cache. Only master writes it, and it keeps one copy: an entry is 4.6 GiB against the repository's 10 GiB.
      - name: Keep the compiled wasm modules between runs
        if: matrix.port == 'wasip1'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-modules-${{ matrix.port }}-${{ github.sha }}
          restore-keys: wasmtime-modules-${{ matrix.port }}-


      - name: Take the toolchain build-linux built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: toolchain-Linux
          path: .

      - name: The restored go answers
        shell: bash
        run: ./bin/go version

      # The dats sandbox mounts .git read-only, so git status there cannot run the LFS clean filter on a file the restore rewrote.
      - name: Refresh the index here, where .git is writable
        shell: bash
        run: git update-index -q --ignore-submodules --refresh

      # The private log-streamer action does not resolve here. These steps do its work, with the OIDC token that reads ls-client.
      - name: Mint a buildhost token
        id: lstoken
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const token = await core.getIDToken('https://pazer.build');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Download the log-streamer client
        id: lsclient
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          project: log-streamer/ls-client
          token: ${{ steps.lstoken.outputs.token }}
          required: 'false'

      - name: The whole test suite (dist test)
        # Actions withholds this job's log for the hour it runs, so the command streams live instead.
        shell: bash
        env:
          LOG_STREAMER_STREAM_KEY: ${{ secrets.LOG_STREAMER_STREAM_KEY }}
          LOG_STREAMER_SERVER: wss://logs.pazer.io
          LOG_STREAMER_NAME: ${{ matrix.port }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/suite-step.sh"
          cat > "$script" <<'EOF'
          set -o pipefail
          export PATH="$PWD/bin:$PWD/lib/wasm:$HOME/.wasmtime/bin:$PATH"
          sh ./.github/resource-log.sh &
          probe=$!
          # the stream client reads until every holder of its pipe exits, so the probe goes when this script does.
          trap 'kill "$probe"' EXIT
          GOOS=${{ matrix.port }} GOARCH=wasm stdbuf -oL -eL go tool dist test 2>&1 | tee "$RUNNER_TEMP/suite.log"
          EOF
          if [ "${{ steps.lsclient.outputs.downloaded }}" != "true" ]; then
            echo "::warning::buildhost refused ls-client to this job, so the suite log does not stream live; it is in this job's log only"
            exec bash "$script"
          fi
          "${{ steps.lsclient.outputs.path }}" shell "$script"

      - name: What ${{ matrix.port }} spent its time on
        # the per-package times are how the js and wasip1 ports get compared, and how a leg that overruns its budget names what overran.
        if: always()
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const required = (name: string): string => {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is not set; the runner or this step's env provides it`);
              return value;
            };
            const summaryPath = required('GITHUB_STEP_SUMMARY');
            const logPath = `${required('RUNNER_TEMP')}/suite.log`;
            const port = required('WASM_PORT');
            if (!fs.existsSync(logPath)) {
              core.info('no suite.log; nothing to report');
              return;
            }
            const rows = [];
            for (const line of fs.readFileSync(logPath, 'utf-8').split('\n')) {
              // dist test prints one of these per package it ran.
              const hit = /^ok\s+(\S+)\s+([0-9.]+)s/.exec(line);
              if (hit) rows.push({ pkg: hit[1], secs: Number(hit[2]) });
            }
            if (rows.length === 0) {
              core.info('no per-package timings found in suite.log');
              return;
            }
            rows.sort((left, right) => right.secs - left.secs);
            const total = rows.reduce((sum, row) => sum + row.secs, 0);
            const top = rows.slice(0, 40);
            const lines = [
              `### ${port} suite timings`,
              '',
              `${rows.length} packages, ${total.toFixed(1)}s of package time.`,
              '',
              '| seconds | package |',
              '| ---: | --- |',
              ...top.map((row) => `| ${row.secs.toFixed(2)} | \`${row.pkg}\` |`),
            ];
            fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
            core.info(`${port}: recorded ${rows.length} package timings, ${total.toFixed(1)}s total`);
        env:
          WASM_PORT: ${{ matrix.port }}

      # The modules of every earlier commit stay in the directory, so a cache past 2 GiB starts over empty.
      - name: Start the wasm module cache over once it outgrows 2 GiB
        if: matrix.port == 'wasip1' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          size=$(du -sm ~/.cache/wasmtime 2>/dev/null | cut -f1)
          echo "wasm module cache: ${size:-0} MiB"
          if [ "${size:-0}" -gt 2048 ]; then rm -rf ~/.cache/wasmtime; fi

      - name: Delete the older wasm module caches
        if: matrix.port == 'wasip1' && github.ref == 'refs/heads/master'
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const prefix = `wasmtime-modules-${process.env.WASM_PORT}-`;
            const caches = await octokit.paginate(octokit.rest.actions.getActionsCacheList, { ...context.repo, key: prefix, per_page: 100 });
            for (const entry of caches) {
              await octokit.rest.actions.deleteActionsCacheById({ ...context.repo, cache_id: entry.id! });
              core.info(`deleted ${entry.key} (${Math.round((entry.size_in_bytes ?? 0) / 1048576)} MiB)`);
            }
        env:
          WASM_PORT: ${{ matrix.port }}

      - name: Save the compiled wasm modules
        if: matrix.port == 'wasip1' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-modules-${{ matrix.port }}-${{ github.sha }}

      - if: failure()
        uses: wow-look-at-my/actions@fail-fast#latest


  # Publishes an installable toolchain distribution to buildhost on every green push -- see docs/CI.md "publish jobs".
  publish-create:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 20 || 10 }}
    # Switching the wasm legs back on goes with putting them back here: a needed job reporting `skipped` skips this one.
    needs: [source-checks, build, build-linux, suite, cosmo-checks, test]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write # mint the OIDC token buildhost authenticates
      contents: read
      artifact-metadata: write
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Create buildhost release
        # No version input: buildhost auto-increments it. See docs/CI.md "publish jobs".
        id: release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-create-release@lkgb
        with:
          project: gosmopolitan

  # Uploading is generic work, so it takes the cheapest runner. Each build leg packaged its own archive; this job only moves them to buildhost.
  publish-upload:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 30 || 15 }}
    needs: publish-create
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Take the archive its build leg packaged
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: distpack-${{ matrix.goos }}-${{ matrix.goarch }}
          path: distpack

      # buildhost-upload-artifact takes an exact file path, and the name carries the version the build leg stamped.
      - name: Locate distribution tarball
        id: tarball
        uses: wow-look-at-my/actions@typescript#latest
        env:
          DIST_SUFFIX: ${{ matrix.goos }}-${{ matrix.goarch }}
        with:
          script: |
            const distDir = 'distpack';
            const suffix = `.${process.env.DIST_SUFFIX}.tar.gz`;
            const names = fs.readdirSync(distDir).filter((f) => f.startsWith('go') && f.endsWith(suffix));
            if (names.length !== 1) {
              throw new Error(`want exactly one go*${suffix} in ${distDir}, ` +
                `found [${names.join(', ')}] among [${fs.readdirSync(distDir).join(', ')}]`);
            }
            const tarball = path.posix.join(distDir, names[0]);
            core.info(`${tarball}: ${fs.statSync(tarball).size} bytes`);
            core.setOutput('path', tarball);
            core.setOutput('name', names[0]);

      - name: Upload toolchain tarball
        timeout-minutes: ${{ github.ref == 'refs/heads/master' && 20 || 10 }}
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-upload-artifact@lkgb
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          kind: archive
          path: ${{ steps.tarball.outputs.path }}
          filename: ${{ steps.tarball.outputs.name }}

      - name: Log uploaded artifact
        shell: bash
        run: |
          echo "::notice::uploaded ${{ steps.tarball.outputs.name }} to gosmopolitan v${{ needs.publish-create.outputs.version }} (${{ matrix.goos }}/${{ matrix.goarch }})"

  publish-finish:
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 20 || 10 }}
    needs: [publish-create, publish-upload]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Publish buildhost release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-release@lkgb
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}

      - name: Log published release
        shell: bash
        run: |
          v='${{ needs.publish-create.outputs.version }}'
          b='${{ github.ref_name }}'
          echo "::notice::published gosmopolitan v$v for linux/amd64 and darwin/arm64"
          echo "::notice::linux:  https://dl.pazer.build/gosmopolitan?branch=$b&os=linux&arch=amd64"
          echo "::notice::darwin: https://dl.pazer.build/gosmopolitan?branch=$b&os=darwin&arch=arm64"

  # A run hands off about 1.5GB, and the repository's cache holds 10GB. Concurrent runs evict each other's hand-offs unless each run drops its own when its readers finish.
  cleanup:
    needs: [suite, cosmo-checks, test, wasm, wasm-suite, publish-upload, publish-finish]
    # A cancelled or failed run still has hand-offs to drop; without this the job is skipped and they are orphaned.
    if: always()
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 20 || 10 }}
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - uses: wow-look-at-my/actions@cache-cleanup#latest
        if: always()
