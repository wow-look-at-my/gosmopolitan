# CI workflow for GOOS=cosmo cross-platform testing -- see CLAUDE.md "CI"

name: Cosmopolitan Cross-Platform CI

on:
  push:
    # matches every branch and no tag, so a tag push does not re-enter this workflow.
    branches: ['**']

jobs:
  # Build Go toolchain and APE test binary on each build platform -- see docs/CI.md "build job".
  build:
    # run.bash is the bulk of it, and dist test reruns anything it has to rebuild.
    timeout-minutes: 150
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build-os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.build-os }}

    steps:
      # src/cmd/vendor holds three submodules; without them cmd/go cannot build.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: wow-look-at-my/actions@yaml-comment-block#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        # Observed max 3m14s (windows make.bat); unix ~2m30s.
        timeout-minutes: 8
        uses: wow-look-at-my/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -v
          windows: cd src && .\make.bat -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - name: Assert tool IDs are content-derived (cross-build cache poisoning guard)
        # see CLAUDE.md "Fork Gotchas" -- "Tool build IDs are content-derived"
        shell: bash
        run: |
          out="$(./bin/go tool compile -V=full)"
          echo "compile -V=full: $out"
          case "$out" in
            *" buildID="*"/"*) echo "OK: tool ID is content-derived" ;;
            *) echo "FAIL: compile -V=full lacks a content-derived buildID field; two different fork builds would share tool IDs and poison warm build caches (see cmd/go/internal/work parseToolID)"; exit 1 ;;
          esac

      - name: Test shebang support - script execution
        if: runner.os != 'Windows'
        run: |
          export PATH="$PWD/bin:$PATH"
          # Pin host GOOS/GOARCH (see above); applies to the shebang go run too.
          export GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)"

          # env -S is required for multi-word shebang interpreters on Linux.
          cat > /tmp/shebang-test.go << 'EOF'
          #!/usr/bin/env -S go run

          package main

          import "fmt"

          func main() {
              fmt.Println("Hello from shebang Go script!")
          }
          EOF

          echo "=== Testing go run with shebang file ==="
          go run /tmp/shebang-test.go

          echo "=== Testing direct script execution ==="
          chmod +x /tmp/shebang-test.go
          /tmp/shebang-test.go

      - name: Build std for cosmo (both arches)
        # The uprev tripwire -- see CLAUDE.md "CI" for what it catches.
        if: matrix.build-os == 'ubuntu-latest'
        timeout-minutes: 15
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          GOOS=cosmo GOARCH=amd64 go build std
          GOOS=cosmo GOARCH=arm64 go build std

      - name: Build downstream go-toolchain consumers for cosmo
        if: matrix.build-os == 'ubuntu-latest'
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          cd "$workdir"
          go mod init cosmo-downstream-smoke
          go get golang.org/x/sys@latest modernc.org/libc@latest modernc.org/sqlite@latest
          GOOS=cosmo GOARCH=amd64 go build golang.org/x/sys/unix modernc.org/libc modernc.org/sqlite
          GOOS=cosmo GOARCH=arm64 go build golang.org/x/sys/unix modernc.org/libc modernc.org/sqlite

      - name: Build APE binary
        # see docs/CI.md "build job" -- no GOARCH pin, and what the ls asserts.
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          GOOS=cosmo go build -o fizzbuzz.com testdata/fizzbuzz/fizzbuzz.go
          # The probe is a multi-file package, so build its module directory.
          (cd testdata/runtimeprobe && GOOS=cosmo go build -o "$GITHUB_WORKSPACE/runtimeprobe.com" .)
          echo "=== APE Header ==="
          head -c 200 fizzbuzz.com
          echo ""
          echo "=== File info ==="
          file fizzbuzz.com runtimeprobe.com 2>/dev/null || true
          export GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)"
          cd testdata/ape/apetest
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/runtimeprobe.com" APE_REQUIRE_SIDECARS=1 go test -run TestFatSidecarsExist -v .

      - name: Build platform-subset APE binaries
        # see docs/CI.md "build job" for the tri/amd subset rationale.
        if: matrix.build-os == 'ubuntu-latest'
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          export GOOS=cosmo
          GOCOSMOPLATFORMS=linux/amd64,darwin/arm64,windows/amd64 go build -o fizzbuzz-tri.com testdata/fizzbuzz/fizzbuzz.go
          (cd testdata/runtimeprobe && GOCOSMOPLATFORMS=linux/amd64,darwin/arm64,windows/amd64 go build -o "$GITHUB_WORKSPACE/runtimeprobe-tri.com" .)
          GOCOSMOPLATFORMS=linux/amd64,windows/amd64 go build -o fizzbuzz-amd.com testdata/fizzbuzz/fizzbuzz.go
          (cd testdata/runtimeprobe && GOCOSMOPLATFORMS=linux/amd64,windows/amd64 go build -o "$GITHUB_WORKSPACE/runtimeprobe-amd.com" .)
          echo "=== sizes ==="
          ls -l fizzbuzz.com fizzbuzz-tri.com fizzbuzz-amd.com
          export GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)"
          cd testdata/ape/apetest
          SLIM_BIN="$GITHUB_WORKSPACE/fizzbuzz-tri.com" SLIM_PLATFORMS=linux/amd64,darwin/arm64,windows/amd64 APE_REQUIRE_SIDECARS=1 go test -run TestSlimSidecarsExist -v .
          SLIM_BIN="$GITHUB_WORKSPACE/fizzbuzz-amd.com" SLIM_PLATFORMS=linux/amd64,windows/amd64 APE_REQUIRE_SIDECARS=1 go test -run TestSlimSidecarsExist -v .

      - name: Upload APE binary
        uses: actions/upload-artifact@v4
        with:
          name: ape-binary-${{ matrix.build-os }}
          path: |
            fizzbuzz.com
            runtimeprobe.com
            fizzbuzz-tri.com
            runtimeprobe-tri.com
            fizzbuzz-amd.com
            runtimeprobe-amd.com
          if-no-files-found: ignore
          retention-days: 1

      # The GOOS=cosmo package tests. Each one names the tests it covers, and a name list is a test-selection decision the suite owns, not this file.
      - name: GOOS=cosmo package tests (dats)
        if: matrix.build-os == 'ubuntu-latest'
        timeout-minutes: 8
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/cosmo-tests.dats

      # Prose nobody asked for is a defect like any other, so a check refuses it.
      - name: No wordspam
        if: matrix.build-os == 'ubuntu-latest'
        timeout-minutes: 2
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/no-wordspam.dats

      # GOOS and GOARCH report the host, and Go cannot make them read-only.
      - name: GOOS and GOARCH stay read-only
        if: matrix.build-os == 'ubuntu-latest'
        timeout-minutes: 2
        uses: wow-look-at-my/dats@master
        with:
          tests: dats/goos-readonly.dats

      - name: The whole test suite (run.bash)
        # the distribution's own all-tests entry point, on every host it builds on. see docs/CI.md.
        timeout-minutes: 90
        uses: wow-look-at-my/actions/multicmd@master
        with:
          unix: cd src && ./run.bash
          windows: cd src && .\run.bat

  # Test all APE binaries on each platform using Go tests -- see docs/CI.md "test job".
  test:
    timeout-minutes: ${{ matrix.job-timeout }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test-os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - test-os: ubuntu-latest
            job-timeout: 25
            apetest-timeout: 5
            apetest-deadline: 240
          - test-os: macos-latest
            job-timeout: 25
            apetest-timeout: 5
            apetest-deadline: 240
          - test-os: windows-latest
            job-timeout: 40
            apetest-timeout: 10
            apetest-deadline: 540

    runs-on: ${{ matrix.test-os }}

    steps:
      - name: Checkout code (for Go tests)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download all APE binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      # No-op on windows: multicmd runs nothing there, and the exec bit means nothing on NTFS.
      - name: Make binaries executable
        uses: wow-look-at-my/actions/multicmd@master
        with:
          unix: chmod +x binaries/ape-binary-*/fizzbuzz*.com binaries/ape-binary-*/runtimeprobe*.com

      # Windows execution acceptance (cosmo NT bring-up); diagnostic only, never fails the job -- see docs/CI.md "test job".
      - name: AF_UNIX capability probe (runner diagnostic)
        if: matrix.test-os == 'windows-latest'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $src = @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class AfUnixProbe {
              [DllImport("ws2_32.dll")] public static extern int WSAStartup(ushort v, byte[] data);
              [DllImport("ws2_32.dll")] public static extern IntPtr WSASocketW(int af, int type, int proto, IntPtr pi, uint g, uint flags);
              [DllImport("ws2_32.dll")] public static extern int bind(IntPtr s, byte[] name, int namelen);
              [DllImport("ws2_32.dll")] public static extern int setsockopt(IntPtr s, int level, int optname, ref int optval, int optlen);
              [DllImport("ws2_32.dll")] public static extern int ioctlsocket(IntPtr s, int cmd, ref int arg);
              [DllImport("ws2_32.dll")] public static extern int WSAGetLastError();
              [DllImport("ws2_32.dll")] public static extern int closesocket(IntPtr s);
              public static void TryCase(string label, uint flags, string path, bool reuse, bool nonblock) {
                  IntPtr s = WSASocketW(1, 1, 0, IntPtr.Zero, 0, flags);
                  if (s == (IntPtr)(-1L)) { Console.WriteLine(label + ": WSASocketW failed " + WSAGetLastError()); return; }
                  if (reuse) {
                      int one = 1;
                      int rr = setsockopt(s, 0xffff, 0x0004, ref one, 4);
                      Console.WriteLine(label + ": setsockopt SO_REUSEADDR " + (rr == 0 ? "OK" : "failed " + WSAGetLastError()));
                  }
                  if (nonblock) {
                      int nb = 1;
                      ioctlsocket(s, unchecked((int)0x8004667E), ref nb);
                  }
                  byte[] p = Encoding.UTF8.GetBytes(path);
                  byte[] sa = new byte[110];
                  sa[0] = 1; sa[1] = 0;
                  Array.Copy(p, 0, sa, 2, p.Length);
                  int r = bind(s, sa, 2 + p.Length + 1);
                  Console.WriteLine(r == 0 ? label + ": bind OK" : label + ": bind failed " + WSAGetLastError());
                  closesocket(s);
                  try { System.IO.File.Delete(path); } catch {}
              }
              public static void Run(string dir) {
                  byte[] d = new byte[512]; WSAStartup(0x0202, d);
                  TryCase("native plain (flags 0x80)", 0x80, System.IO.Path.Combine(dir, "afu-1.sock"), false, false);
                  TryCase("native +SO_REUSEADDR", 0x80, System.IO.Path.Combine(dir, "afu-2.sock"), true, false);
                  TryCase("native +FIONBIO", 0x80, System.IO.Path.Combine(dir, "afu-3.sock"), false, true);
                  TryCase("native +SO_REUSEADDR+FIONBIO", 0x80, System.IO.Path.Combine(dir, "afu-4.sock"), true, true);
                  Console.WriteLine("GetTempPath=" + System.IO.Path.GetTempPath());
                  TryCase("native plain at GetTempPath", 0x80, System.IO.Path.Combine(System.IO.Path.GetTempPath(), "afu-5.sock"), false, false);
              }
          }
          '@
          try {
            Add-Type -TypeDefinition $src
            [AfUnixProbe]::Run($env:RUNNER_TEMP)
          } catch { Write-Host "native probe error: $_" }
          try {
            $mp = Join-Path $env:RUNNER_TEMP 'afu-managed.sock'
            $sock = [System.Net.Sockets.Socket]::new([System.Net.Sockets.AddressFamily]::Unix, [System.Net.Sockets.SocketType]::Stream, [System.Net.Sockets.ProtocolType]::Unspecified)
            $ep = [System.Net.Sockets.UnixDomainSocketEndPoint]::new($mp)
            $sock.Bind($ep)
            Write-Host 'managed .NET UnixDomainSocket: bind OK'
            $sock.Close()
            Remove-Item $mp -ErrorAction SilentlyContinue
          } catch { Write-Host "managed .NET UnixDomainSocket: $_" }
          exit 0

      - name: Run fizzbuzz on Windows (NT boot acceptance)
        if: matrix.test-os == 'windows-latest'
        timeout-minutes: 5
        shell: pwsh
        run: |
          # see docs/CI.md "test job" for why Start-Process + $p.ExitCode is used here instead of pwsh native invocation.
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $cases = @(
            @{ Args = @('10', '5'); Want = "fizzbuzz`n" },
            @{ Args = @('7', '6');  Want = "13`n" }
          )
          foreach ($origin in @('ubuntu-latest', 'windows-latest')) {
            # Throwaway copy: keeps the downloaded artifact pristine (APE binaries self-assimilate on unix hosts).
            $src = "binaries/ape-binary-$origin/fizzbuzz.com"
            $copy = Join-Path $env:RUNNER_TEMP "fizzbuzz-$origin.com"
            Copy-Item $src $copy
            foreach ($case in $cases) {
              $out = Join-Path $env:RUNNER_TEMP "stdout-$origin-$($case.Args -join '-').txt"
              Write-Host "${origin}: launching $copy $($case.Args -join ' ')"
              $p = Start-Process -FilePath $copy -ArgumentList $case.Args -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
              $got = [System.IO.File]::ReadAllText($out)
              Write-Host "${origin}: exit code $($p.ExitCode) (want 0), stdout $($got | ConvertTo-Json)"
              if ($p.ExitCode -ne 0) { $failed = $true }
              if ($got -cne $case.Want) {
                Write-Host "${origin}: stdout mismatch: got $($got | ConvertTo-Json), want $($case.Want | ConvertTo-Json)"
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 } else { exit 0 }

      # Prefetched separately so a stalled module download can't masquerade as a hung test step.
      - name: Download apetest modules
        timeout-minutes: 3
        shell: bash
        run: |
          cd testdata/ape/apetest
          sh ./with-deadline.sh 150 go mod download

      # In-step process-group killer (with-deadline.sh) -- see docs/CI.md "test job" for why runner-side timeouts aren't enough.
      - name: Test binary built on Ubuntu
        id: test-ubuntu
        timeout-minutes: ${{ matrix.apetest-timeout }}
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/runtimeprobe.com" sh ./with-deadline.sh ${{ matrix.apetest-deadline }} go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      # Uploaded immediately: job-level logs only reach the API when the whole job ends (see docs/CI.md "test job").
      - name: Upload ubuntu-origin test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.test-os }}-ubuntu-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

      - name: Test binary built on macOS
        id: test-macos
        timeout-minutes: ${{ matrix.apetest-timeout }}
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-macos-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-macos-latest/runtimeprobe.com" sh ./with-deadline.sh ${{ matrix.apetest-deadline }} go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      # Uploaded immediately: job-level logs only reach the API when the whole job ends (see docs/CI.md "test job").
      - name: Upload macos-origin test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.test-os }}-macos-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

      - name: Test binary built on Windows
        id: test-windows
        timeout-minutes: ${{ matrix.apetest-timeout }}
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/runtimeprobe.com" sh ./with-deadline.sh ${{ matrix.apetest-deadline }} go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      # Uploaded immediately: job-level logs only reach the API when the whole job ends (see docs/CI.md "test job").
      - name: Upload windows-origin test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.test-os }}-windows-origin
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

      # A platform-subset APE must boot and run on the real host on every platform it claims -- see docs/CI.md "test job".
      - name: Test platform-subset APEs
        id: test-subset
        timeout-minutes: ${{ matrix.apetest-timeout }}
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          bins="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest"
          rc=0
          : > test-output.log
          run_subset() {
            name="$1" platforms="$2"
            echo "=== subset $name: $platforms ===" >> test-output.log
            FIZZBUZZ_BIN="$bins/fizzbuzz-$name.com" \
            RUNTIMEPROBE_BIN="$bins/runtimeprobe-$name.com" \
            SLIM_BIN="$bins/fizzbuzz-$name.com" \
            SLIM_PLATFORMS="$platforms" \
            FAT_BIN="$bins/fizzbuzz.com" \
              sh ./with-deadline.sh ${{ matrix.apetest-deadline }} \
              go test -v -run 'Fizz|Buzz|Number|Large|Mixed|Error|RuntimeProbe|Slim' ./... >> test-output.log 2>&1
          }
          run_subset tri linux/amd64,darwin/arm64,windows/amd64 || rc=$?
          run_subset amd linux/amd64,windows/amd64 || rc=$?
          cat test-output.log
          exit $rc

      - name: Upload subset test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.test-os }}-subset
          path: testdata/ape/apetest/test-output.log
          retention-days: 3

  # Regression-gate the WebAssembly ports (GOOS=js and GOOS=wasip1) -- see docs/WASM.md and docs/CI.md "wasm job".
  wasm:
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # wasm_exec_node.js (the js/wasm exec wrapper in lib/wasm) requires node >= 18.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wazero (wasip1 runtime)
        # Runs before the fork toolchain is built so `go` is unambiguously the setup-go bootstrap -- see docs/CI.md "wasm job".
        timeout-minutes: 5
        shell: bash
        run: GOOS=linux GOARCH=amd64 GOBIN="$HOME/wasibin" go install github.com/tetratelabs/wazero/cmd/wazero@v1.12.0

      - name: Build Go toolchain
        # Same build as the build job's ubuntu leg; observed ~2m30s.
        timeout-minutes: 8
        shell: bash
        run: cd src && ./make.bash -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - name: Build std for js/wasm and wasip1/wasm
        # Observed 22s + 15s locally on a cold cache.
        timeout-minutes: 5
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          GOOS=js GOARCH=wasm go build std
          GOOS=wasip1 GOARCH=wasm go build std

      - name: Test the wasm object writer (host-side codegen)
        # Runs on the HOST, so it needs an explicit GOOS=linux -- see docs/CI.md "wasm job".
        timeout-minutes: 5
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          GOOS=linux GOARCH=amd64 go test -count=1 cmd/internal/obj/wasm

      - name: Test js/wasm under node
        # Observed 1m18s locally. lib/wasm supplies go_js_wasm_exec.
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$PATH"
          GOOS=js GOARCH=wasm go test -short -count=1 runtime runtime/pprof sync sync/atomic time os syscall syscall/js math math/bits os/signal net/http

      - name: Test streaming fetch uploads under node (jsfetchstream e2e)
        # Proves GODEBUG=jsfetchnode=1 request bodies with unknown length actually STREAM -- see docs/CI.md "wasm job".
        timeout-minutes: 5
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$PATH"
          (cd testdata/jsfetchstream && GOOS=js GOARCH=wasm go build -o /tmp/jsfetchstream.wasm .)
          node testdata/jsfetchstream/run.js lib/wasm /tmp/jsfetchstream.wasm

      - name: Test wasip1/wasm under wazero
        # Observed 57s locally. lib/wasm supplies go_wasip1_wasm_exec.
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$HOME/wasibin:$PATH"
          GOWASIRUNTIME=wazero GOOS=wasip1 GOARCH=wasm go test -short -count=1 runtime runtime/pprof sync sync/atomic time os syscall math

      - name: Test GOWASI=wasmedgesock (wasip1sock reference host, TCP+UDP)
        # see docs/CI.md "wasm job". GOOS pinned: the fork defaults GOOS=cosmo.
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          cd testdata/wasip1sock/host
          GOOS=linux GOARCH=amd64 go test -count=1 ./...

      - name: Test GOWASM=threads under node (js only)
        # see docs/CI.md "wasm job" and docs/WASM.md for the multi-P scheduler this exercises.
        timeout-minutes: 15
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$PATH"
          (cd testdata/wasmthreads && GOOS=js GOARCH=wasm GOWASM=threads go build -o /tmp/wasmthreads-smoke.wasm .)
          node lib/wasm/wasm_exec_node.js /tmp/wasmthreads-smoke.wasm
          (cd testdata/wasmthreads && GOOS=js GOARCH=wasm GOWASM=threads go build -o /tmp/pooldemo.wasm ./pooldemo)
          # pool_demo gate: see DEBUGGING.md, pool_demo silent-fatal.
          set -o pipefail
          node testdata/wasmthreads/pool_demo.js lib/wasm /tmp/pooldemo.wasm 2>&1 | tee /tmp/pooldemo.out
          grep -q "POOLDEMO: PASS" /tmp/pooldemo.out
          ! grep -q "fatal error" /tmp/pooldemo.out
          (cd testdata/wasmthreads && GOOS=js GOARCH=wasm GOWASM=threads go build -ldflags=-checklinkname=0 -o /tmp/threaddemo.wasm ./threaddemo)
          for i in $(seq 1 10); do
            echo "=== threaddemo run $i ==="
            node lib/wasm/wasm_exec_node.js /tmp/threaddemo.wasm | tee /tmp/threaddemo.out
            grep -q "THREADDEMO: PASS" /tmp/threaddemo.out
          done
          # B3: multi-P demos (reduced iterations for CI).
          (cd testdata/wasmthreads && GOOS=js GOARCH=wasm GOWASM=threads go build -ldflags=-checklinkname=0 -o /tmp/speedup.wasm ./speedup)
          (cd testdata/wasmthreads && GOOS=js GOARCH=wasm GOWASM=threads go build -ldflags=-checklinkname=0 -o /tmp/stwgc.wasm ./stwgc)
          (cd testdata/wasmthreads && GOOS=js GOARCH=wasm GOWASM=threads go build -ldflags=-checklinkname=0 -o /tmp/liveness.wasm ./liveness)
          # The demos print via println (stderr), so the gates capture stderr; pipefail so a nonzero node exit fails the step.
          set -o pipefail
          GOMAXPROCS=1 SPEEDUP_ITERS=20000000 node lib/wasm/wasm_exec_node.js /tmp/speedup.wasm 2>&1 | tee /tmp/speedup1.out
          grep -q "SPEEDUP: DONE" /tmp/speedup1.out
          GOMAXPROCS=4 GOWASMTHREADSPOOL=6 SPEEDUP_ITERS=20000000 node lib/wasm/wasm_exec_node.js /tmp/speedup.wasm 2>&1 | tee /tmp/speedup4.out
          grep -q "SPEEDUP: DONE" /tmp/speedup4.out
          [ "$(grep 'checksum =' /tmp/speedup1.out)" = "$(grep 'checksum =' /tmp/speedup4.out)" ]
          for i in $(seq 1 3); do
            echo "=== stwgc run $i ==="
            GOMAXPROCS=4 STWGC_CYCLES=15 node lib/wasm/wasm_exec_node.js /tmp/stwgc.wasm 2>&1 | tee /tmp/stwgc.out
            grep -q "STWGC: PASS" /tmp/stwgc.out
          done
          GOMAXPROCS=4 GODEBUG=gcstoptheworld=1 STWGC_CYCLES=8 node lib/wasm/wasm_exec_node.js /tmp/stwgc.wasm 2>&1 | tee /tmp/stwgc-stw.out
          grep -q "STWGC: PASS" /tmp/stwgc-stw.out
          GOMAXPROCS=4 LIVENESS_BUSY_MS=1200 node lib/wasm/wasm_exec_node.js /tmp/liveness.wasm 2>&1 | tee /tmp/liveness.out
          grep -q "LIVENESS: PASS" /tmp/liveness.out
          # Cross-thread grow-observation gate -- see docs/CI.md "wasm job".
          (cd testdata/wasmthreads && GOOS=js GOARCH=wasm GOWASM=threads go build -ldflags=-checklinkname=0 -o /tmp/growatomic.wasm ./growatomic)
          GOMAXPROCS=4 node lib/wasm/wasm_exec_node.js /tmp/growatomic.wasm 2>&1 | tee /tmp/growatomic.out
          grep -q "GROWATOMIC: PASS" /tmp/growatomic.out
          GOOS=js GOARCH=wasm GOWASM=threads go test -short -count=1 sync sync/atomic internal/runtime/atomic runtime
          if (cd testdata/wasmthreads && GOOS=wasip1 GOARCH=wasm GOWASM=threads go build -o /dev/null .) 2>/tmp/wasip1-threads.err; then
            echo "expected GOOS=wasip1 GOWASM=threads to be rejected" >&2
            exit 1
          fi
          grep -q "GOWASM=threads is only supported on GOOS=js" /tmp/wasip1-threads.err

      - name: Compiler regression tests (testdir wasmexport, both targets)
        # GOOS=linux pin: the harness test binary runs on the host (the fork's go would otherwise target cosmo).
        timeout-minutes: 5
        shell: bash
        run: |
          export PATH="$PWD/bin:$PWD/lib/wasm:$HOME/wasibin:$PATH"
          GOWASIRUNTIME=wazero GOOS=linux GOARCH=amd64 go test cmd/internal/testdir -run 'Test/wasmexport' -target=js/wasm
          GOWASIRUNTIME=wazero GOOS=linux GOARCH=amd64 go test cmd/internal/testdir -run 'Test/wasmexport' -target=wasip1/wasm

  # Publishes an installable toolchain distribution to buildhost on every green push -- see docs/CI.md "publish jobs".
  publish-create:
    timeout-minutes: 10
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token buildhost authenticates
      contents: read
      artifact-metadata: write
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create buildhost release
        # No version input: buildhost auto-increments it. See docs/CI.md "publish jobs".
        id: release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-create-release@master
        with:
          project: gosmopolitan

  publish-upload:
    # macOS make.bash runs ~4m30s at its slowest observed and windows make.bat ~3m15s; distpack adds seconds.
    timeout-minutes: 25
    needs: publish-create
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      # make.bash fails a CI run with no shared cache configured; this step exports GO_BUILDCACHE_CONFIG.
      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Stamp unique per-release version
        # see docs/CI.md "publish jobs" -- avoids collisions in the shared build cache namespace.
        shell: bash
        run: |
          printf '%s.r%s\n' "$(head -n1 VERSION)" '${{ github.run_number }}' > VERSION
          echo "VERSION stamped: $(cat VERSION)"

      - name: Build distribution archive
        # Writes the official-style go<VERSION>.<goos>-<goarch>.tar.gz to pkg/distpack, on every platform -- see docs/CI.md "publish jobs".
        timeout-minutes: 15
        uses: wow-look-at-my/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -distpack
          windows: cd src && .\make.bat -distpack
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      # Publish flow: buildhost's own composite actions -- see docs/CI.md "publish jobs".
      - name: Locate distribution tarball
        id: tarball
        uses: wow-look-at-my/actions@typescript#latest
        env:
          DIST_SUFFIX: ${{ matrix.goos }}-${{ matrix.goarch }}
        with:
          script: |
            // buildhost-upload-artifact takes an exact file path -- resolve the versioned distpack tarball name (go<VERSION>.<goos>-<goarch>.tar.gz)
            const distDir = 'pkg/distpack';
            const suffix = `.${process.env.DIST_SUFFIX}.tar.gz`;
            const names = fs.readdirSync(distDir).filter((f) => f.startsWith('go') && f.endsWith(suffix));
            if (names.length !== 1) {
              throw new Error(`want exactly one go*${suffix} in ${distDir}, ` +
                `found [${names.join(', ')}] among [${fs.readdirSync(distDir).join(', ')}]`);
            }
            // Forward slashes: a windows path loses its separators crossing the step output, and node opens either spelling.
            const tarball = path.posix.join(distDir, names[0]);
            core.info(`${tarball}: ${fs.statSync(tarball).size} bytes`);
            core.setOutput('path', tarball);
            core.setOutput('name', names[0]);

      - name: Upload toolchain tarball
        timeout-minutes: 10
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-upload-artifact@master
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          kind: archive
          path: ${{ steps.tarball.outputs.path }}
          filename: ${{ steps.tarball.outputs.name }}

      - name: Log uploaded artifact
        shell: bash
        run: |
          echo "::notice::uploaded ${{ steps.tarball.outputs.name }} to gosmopolitan v${{ needs.publish-create.outputs.version }} (${{ matrix.goos }}/${{ matrix.goarch }})"

  publish-finish:
    timeout-minutes: 10
    needs: [publish-create, publish-upload]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Publish buildhost release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-release@master
        with:
          project: gosmopolitan
          version: ${{ needs.publish-create.outputs.version }}

      - name: Log published release
        shell: bash
        run: |
          v='${{ needs.publish-create.outputs.version }}'
          b='${{ github.ref_name }}'
          echo "::notice::published gosmopolitan v$v for linux/amd64 and darwin/arm64"
          echo "::notice::linux:  https://dl.pazer.build/gosmopolitan?branch=$b&os=linux&arch=amd64"
          echo "::notice::darwin: https://dl.pazer.build/gosmopolitan?branch=$b&os=darwin&arch=arm64"
