# CI workflow for GOOS=cosmo cross-platform testing
# Tests that APE binaries built on any platform run on all platforms
# Each test runner tests all 3 binaries (native + 2 cross-compiled)

name: Cosmopolitan Cross-Platform CI

on:
  push:
  workflow_dispatch:

jobs:
  # Build Go toolchain and APE test binary on each build platform
  build:
    strategy:
      fail-fast: false
      matrix:
        build-os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.build-os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        uses: wow-look-at-my-code/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -v
          windows: cd src && .\make.bat -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - name: Build APE binary
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          # GOARCH must be pinned: the linker emits a single-arch APE (no
          # automatic fat binary), and on arm64 runners (macos-latest) the
          # host default produces an arm64-only binary that the amd64 test
          # matrix can neither parse nor run.
          GOOS=cosmo GOARCH=amd64 go build -o fizzbuzz.com testdata/fizzbuzz/fizzbuzz.go
          echo "=== APE Header ==="
          head -c 200 fizzbuzz.com
          echo ""
          echo "=== File info ==="
          file fizzbuzz.com 2>/dev/null || true
          ls -la fizzbuzz.com

      - name: Upload APE binary
        uses: actions/upload-artifact@v4
        with:
          name: ape-binary-${{ matrix.build-os }}
          path: fizzbuzz.com
          retention-days: 1

  # Test all APE binaries on each platform using Go tests
  # Each runner tests all 3 binaries sequentially (native + 2 cross-compiled)
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test-os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.test-os }}

    steps:
      - name: Checkout code (for Go tests)
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download all APE binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Make binaries executable
        uses: wow-look-at-my-code/actions/multicmd@master
        with:
          unix: chmod +x binaries/ape-binary-*/fizzbuzz.com

      # Temporary diagnostics for the SIGKILL-on-exec failures: traces the
      # APE bootstrap, shows signature state after assimilation, retries
      # codesign with errors visible, and attempts a direct exec.
      - name: Debug APE bootstrap (macOS)
        if: matrix.test-os == 'macos-latest'
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          sw_vers
          uname -m
          arch -x86_64 /usr/bin/true; echo "rosetta probe exit=$?"
          cp binaries/ape-binary-ubuntu-latest/fizzbuzz.com /tmp/fb.com
          chmod +x /tmp/fb.com
          echo "=== bootstrap trace (sh -x) ==="
          sh -x /tmp/fb.com 3 5
          echo "traced run exit=$?"
          echo "=== file state after assimilation ==="
          file /tmp/fb.com
          codesign -dv /tmp/fb.com; echo "codesign -dv exit=$?"
          echo "=== manual ad-hoc sign (errors visible) ==="
          codesign -f -s - /tmp/fb.com; echo "manual codesign exit=$?"
          codesign -dv /tmp/fb.com; echo "codesign -dv after manual sign exit=$?"
          echo "=== direct exec after assimilation+signing ==="
          /tmp/fb.com 3 5; echo "direct exec exit=$?"
          true

      - name: Test binary built on Ubuntu
        id: test-ubuntu
        timeout-minutes: 1
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/fizzbuzz.com" go test -v ./...

      - name: Test binary built on macOS
        id: test-macos
        timeout-minutes: 1
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-macos-latest/fizzbuzz.com" go test -v ./...

      - name: Test binary built on Windows
        id: test-windows
        timeout-minutes: 1
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/fizzbuzz.com" go test -v ./...
