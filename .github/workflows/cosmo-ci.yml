# CI workflow for GOOS=cosmo cross-platform testing
# Tests that APE binaries built on any platform run on all platforms
# Each test runner tests all 3 binaries (native + 2 cross-compiled)

name: Cosmopolitan Cross-Platform CI

on:
  push:
  workflow_dispatch:

jobs:
  # Build Go toolchain and APE test binary on each build platform
  #
  # Job and step timeout-minutes are deliberate everywhere: a hung cosmo
  # binary (or a wedged runner) must never burn GitHub's 6-hour default.
  # Limits are sized ~2x (or a round number above) the slowest duration
  # observed across recent green runs; see the values at each step.
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build-os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.build-os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go bootstrap toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Go toolchain
        # Observed max 3m14s (windows make.bat); unix ~2m30s.
        timeout-minutes: 8
        uses: wow-look-at-my-code/actions/multicmd@master
        with:
          unix: cd src && ./make.bash -v
          windows: cd src && .\make.bat -v
        env:
          GOROOT_BOOTSTRAP: ${{ env.GOROOT }}

      - name: Build APE binary
        # Observed max 38s (windows; two fat builds = six link passes).
        timeout-minutes: 10
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          # No GOARCH pin: GOOS=cosmo go build emits a fat (amd64+arm64)
          # APE regardless of the host architecture.
          GOOS=cosmo go build -o fizzbuzz.com testdata/fizzbuzz/fizzbuzz.go
          GOOS=cosmo go build -o runtimeprobe.com testdata/runtimeprobe/runtimeprobe.go
          echo "=== APE Header ==="
          head -c 200 fizzbuzz.com
          echo ""
          echo "=== File info ==="
          file fizzbuzz.com runtimeprobe.com 2>/dev/null || true
          ls -la fizzbuzz.com runtimeprobe.com

      - name: Upload APE binary
        uses: actions/upload-artifact@v4
        with:
          name: ape-binary-${{ matrix.build-os }}
          path: |
            fizzbuzz.com
            runtimeprobe.com
          retention-days: 1

  # Test all APE binaries on each platform using Go tests
  # Each runner tests all 3 binaries sequentially (native + 2 cross-compiled)
  #
  # Job-level cap: 3 test steps at 5 minutes each plus setup; observed
  # green total is under 2 minutes. Individual steps carry their own
  # timeout-minutes (and an in-step killer, see with-deadline.sh).
  test:
    timeout-minutes: 25
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test-os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.test-os }}

    steps:
      - name: Checkout code (for Go tests)
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download all APE binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Make binaries executable
        uses: wow-look-at-my-code/actions/multicmd@master
        with:
          unix: chmod +x binaries/ape-binary-*/fizzbuzz.com binaries/ape-binary-*/runtimeprobe.com

      # Prefetch test-module dependencies separately so a stalled module
      # download cannot masquerade as a hung test step.
      - name: Download apetest modules
        timeout-minutes: 3
        shell: bash
        run: |
          cd testdata/ape/apetest
          sh ./with-deadline.sh 150 go mod download

      # Each test step runs go test under an in-step process-group killer
      # (see with-deadline.sh): runner-side step timeouts have been
      # observed not to fire when a step wedges on the macOS runners
      # (jobs sat 30+ minutes past timeout-minutes and uploaded no logs;
      # one wedged process even survived a process-group SIGKILL, i.e. it
      # was stuck in an uninterruptible kernel state). The killer abandons
      # such a corpse so the step still ends, and go test's output goes
      # through a FILE (cat'ed afterwards) so no abandoned descendant can
      # keep the runner's log pipe open.
      - name: Test binary built on Ubuntu
        id: test-ubuntu
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-ubuntu-latest/runtimeprobe.com" sh ./with-deadline.sh 240 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      - name: Test binary built on macOS
        id: test-macos
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-macos-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-macos-latest/runtimeprobe.com" sh ./with-deadline.sh 240 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc

      - name: Test binary built on Windows
        id: test-windows
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          cd testdata/ape/apetest
          rc=0
          FIZZBUZZ_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/fizzbuzz.com" RUNTIMEPROBE_BIN="$GITHUB_WORKSPACE/binaries/ape-binary-windows-latest/runtimeprobe.com" sh ./with-deadline.sh 240 go test -v ./... > test-output.log 2>&1 || rc=$?
          cat test-output.log
          exit $rc
