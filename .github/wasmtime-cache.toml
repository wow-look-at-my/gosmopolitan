# Bound wasmtime's compiled-module cache on a CI runner.
#
# wasmtime enforces its size limit only when cleanup runs, and cleanup runs on
# an interval that defaults to an hour. The wasip1 suite is shorter than that,
# so the limit never applies while the suite is the thing filling the disk. A
# measured local run reached 2.1 GB partway through, against the ~14 GB a
# hosted runner has free.
#
# The interval here is short enough to apply inside one run. The limit is large
# enough that the cache still earns its place: a cold module compile is most of
# the cost of a cheap package.

[cache]
enabled = true
cleanup-interval = "2m"
files-total-size-soft-limit = "2Gi"
